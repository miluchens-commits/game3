<!DOCTYPE html>

<style>

<script>
var scene,camera,renderer,clock;
var player,playerPos=new THREE.Vector3(0,0,26),playerVel=new THREE.Vector3(),playerYaw=Math.PI,onGround=true;
var keys={},camTheta=Math.PI,camPhi=0.32,camDist=7;
var GRAV=3.4,JUMP_V=7.2,JET_V=11;
var interactables=[],nearObj=null,driving=false;
var rover={grp:null,yaw:0,speed:0,wheels:[]};
var flagCloth=null,flagWave=0;
var interiorLights=[];
var earthMesh=null;

function terrainH(x,z){
 var r=Math.sqrt(x*x+z*z);
 var h=0;
 var n=Math.sin(x*0.05)*Math.cos(z*0.06)*1.1+Math.sin(x*0.13+3)*Math.sin(z*0.11)*0.5;
 h+=n*Math.min(1,(r-13)/25);
 if(r>13){for(var i=0;i<CRATERS.length;i++){var c=CRATERS[i];var dx=x-c.x,dz=z-c.z;var d=Math.sqrt(dx*dx+dz*dz);if(d<c.r*2.2){var t=1-d/(c.r*2.2);h-=Math.cos(t*Math.PI)*0.5*c.d*(d>c.r*0.35?1:0.25);}}}
 return h;
}
var CRATERS=[{x:-38,z:-20,r:9,d:2.4},{x:42,z:30,r:12,d:3},{x:-30,z:48,r:7,d:1.8},{x:55,z:-42,r:8,d:2.2},{x:-60,z:-55,r:14,d:3.5},{x:25,z:-60,r:6,d:1.5}];

function makeEarthTexture(){
 var cv=document.createElement('canvas');cv.width=512;cv.height=256;
 var cx=cv.getContext('2d');
 cx.fillStyle='#1a5fb8';cx.fillRect(0,0,512,256);
 cx.fillStyle='#2f7fd4';cx.fillRect(0,0,512,128);
 var greens=['#3d8f4e','#4da35c','#2e7a41','#57b06a'];
 var seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
 for(var i=0;i<26;i++){
  var gx=rnd()*512,gy=rnd()*256,gw=30+rnd()*90,gh=20+rnd()*60;
  cx.fillStyle=greens[Math.floor(rnd()*4)];
  cx.beginPath();
  for(var a=0;a<=12;a++){var ang=a/12*Math.PI*2;var rr=(gw*gh)/(Math.hypot(gw*Math.cos(ang),gh*Math.sin(ang))||1)*0.5*(0.7+rnd()*0.5);cx.lineTo(gx+Math.cos(ang)*rr,gy+Math.sin(ang)*rr);}
  cx.closePath();cx.fill();
 }
 cx.fillStyle='rgba(255,255,255,0.75)';
 for(var i=0;i<40;i++){
  var wx=rnd()*512,wy=rnd()*256;
  cx.beginPath();cx.ellipse(wx,wy,14+rnd()*30,5+rnd()*9,rnd()*3,0,Math.PI*2);cx.fill();
 }
 var tx=new THREE.CanvasTexture(cv);
 return tx;
}

function buildWorld(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x020308);

 var sun=new THREE.DirectionalLight(0xfff4e0,1.5);
 sun.position.set(-60,80,-40);sun.castShadow=true;
 sun.shadow.mapSize.set(2048,2048);
 sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;sun.shadow.camera.far=250;
 scene.add(sun);
 var sunGlowCv=document.createElement('canvas');sunGlowCv.width=sunGlowCv.height=128;
 var sg=sunGlowCv.getContext('2d');
 var gr=sg.createRadialGradient(64,64,0,64,64,64);
 gr.addColorStop(0,'rgba(255,250,230,1)');gr.addColorStop(0.25,'rgba(255,240,200,0.85)');gr.addColorStop(1,'rgba(255,220,160,0)');
 sg.fillStyle=gr;sg.fillRect(0,0,128,128);
 var sunSpr=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(sunGlowCv),transparent:true,depthWrite:false}));
 sunSpr.scale.set(50,50,1);sunSpr.position.set(-120,160,-80);scene.add(sunSpr);

 var starGeo=new THREE.BufferGeometry();
 var sp=[];for(var i=0;i<2200;i++){var t=Math.random()*Math.PI*2,p=Math.acos(Math.random()*2-1),r=420;sp.push(r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t));}
 starGeo.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
 var stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:1.4,sizeAttenuation:false,transparent:true,opacity:0.9}));
 scene.add(stars);

 earthMesh=new THREE.Mesh(new THREE.SphereGeometry(20,48,48),new THREE.MeshStandardMaterial({map:makeEarthTexture(),roughness:0.7,metalness:0}));
 earthMesh.position.set(-130,120,-190);
 earthMesh.rotation.z=0.4;
 scene.add(earthMesh);
 var atm=new THREE.Mesh(new THREE.SphereGeometry(21.5,48,48),new THREE.MeshBasicMaterial({color:0x66aaff,transparent:true,opacity:0.18,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));
 atm.position.copy(earthMesh.position);scene.add(atm);

 var terrGeo=new THREE.PlaneGeometry(340,340,140,140);
 terrGeo.rotateX(-Math.PI/2);
 var pos=terrGeo.attributes.position;
 var cols=[];
 for(var i=0;i<pos.count;i++){
  var x=pos.getX(i),z=pos.getZ(i);
  pos.setY(i,terrainH(x,z));
  var shade=0.56+Math.random()*0.07+(x*0.0004);
  cols.push(shade*0.98,shade,shade*1.04);
 }
 terrGeo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
 terrGeo.computeVertexNormals();
 var terr=new THREE.Mesh(terrGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.96,metalness:0}));
 terr.receiveShadow=true;
 scene.add(terr);

 var padGeo=new THREE.CylinderGeometry(9,9.6,0.5,36);
 var pad=new THREE.Mesh(padGeo,new THREE.MeshStandardMaterial({color:0x3a3f4a,roughness:0.6,metalness:0.5}));
 pad.position.set(0,terrainH(0,-38)+0.25,-38);pad.receiveShadow=true;scene.add(pad);
 var padRing=new THREE.Mesh(new THREE.TorusGeometry(8.2,0.16,8,40),new THREE.MeshBasicMaterial({color:0xffaa33}));
 padRing.rotation.x=Math.PI/2;padRing.position.set(0,terrainH(0,-38)+0.55,-38);scene.add(padRing);
 var padMark=new THREE.Mesh(new THREE.CircleGeometry(3.2,24),new THREE.MeshBasicMaterial({color:0xd8dde6}));
 padMark.rotation.x=-Math.PI/2;padMark.position.set(0,terrainH(0,-38)+0.53,-38);scene.add(padMark);
 for(var i=0;i<8;i++){var a=i/8*Math.PI*2;var pl=new THREE.Mesh(new THREE.SphereGeometry(0.18,8,8),new THREE.MeshBasicMaterial({color:0xffcc66}));pl.position.set(Math.cos(a)*7.6,terrainH(0,-38)+0.62,-38+Math.sin(a)*7.6);scene.add(pl);}

 for(var i=0;i<26;i++){
  var rx=(Math.random()-0.5)*220,rz=(Math.random()-0.5)*220;
  if(Math.hypot(rx,rz)<24||Math.hypot(rx,rz+38)<14)continue;
  var rs=0.5+Math.random()*2.2;
  var rock=new THREE.Mesh(new THREE.IcosahedronGeometry(rs,0),new THREE.MeshStandardMaterial({color:0x777779,roughness:1,flatShading:true}));
  rock.position.set(rx,terrainH(rx,rz)+rs*0.3,rz);
  rock.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
  rock.castShadow=true;rock.receiveShadow=true;scene.add(rock);
 }

 buildBase();
 buildScenery();
 buildRover();

 var flagGrp=new THREE.Group();
 var pole=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,4.4,8),new THREE.MeshStandardMaterial({color:0xd0d0d4,metalness:0.8,roughness:0.3}));
 pole.position.y=2.2;pole.castShadow=true;flagGrp.add(pole);
 var clothGeo=new THREE.PlaneGeometry(1.8,1.1,12,6);
 clothGeo.translate(0.9,0,0);
 flagCloth={mesh:new THREE.Mesh(clothGeo,new THREE.MeshStandardMaterial({color:0xff4444,side:THREE.DoubleSide,roughness:0.8})),base:clothGeo.attributes.position.clone()};
 flagCloth.mesh.position.y=3.6;flagCloth.mesh.castShadow=true;flagGrp.add(flagCloth.mesh);
 flagGrp.position.set(14,terrainH(14,20),20);
 scene.add(flagGrp);
 registerInteract(flagGrp,2.6,'🚩 國旗','讓國旗飄揚!',function(){flagWave=1;toast('🚩 國旗在低重力下緩緩飄揚…');});
}

function buildBase(){
 var base=new THREE.Group();
 var R=11,FLOOR_Y=0.3,H=4.6;
 var floor=new THREE.Mesh(new THREE.CylinderGeometry(R,R,0.6,48),
  new THREE.MeshStandardMaterial({color:0x494f5c,roughness:0.55,metalness:0.35}));
 floor.position.y=FLOOR_Y-0.3;floor.receiveShadow=true;base.add(floor);
 var gridCv=document.createElement('canvas');gridCv.width=gridCv.height=512;
 var gc=gridCv.getContext('2d');
 gc.fillStyle='#4a5160';gc.fillRect(0,0,512,512);
 gc.strokeStyle='rgba(120,200,255,0.28)';gc.lineWidth=2;
 for(var i=0;i<=8;i++){gc.beginPath();gc.moveTo(i*64,0);gc.lineTo(i*64,512);gc.stroke();gc.beginPath();gc.moveTo(0,i*64);gc.lineTo(512,i*64);gc.stroke();}
 var gridTx=new THREE.CanvasTexture(gridCv);
 var innerFloor=new THREE.Mesh(new THREE.CircleGeometry(R-0.3,48),new THREE.MeshStandardMaterial({map:gridTx,roughness:0.5,metalness:0.4}));
 innerFloor.rotation.x=-Math.PI/2;innerFloor.position.y=FLOOR_Y+0.02;innerFloor.receiveShadow=true;base.add(innerFloor);

 var rug=new THREE.Mesh(new THREE.CircleGeometry(3.4,32),new THREE.MeshStandardMaterial({color:0x35507a,roughness:0.9}));
 rug.rotation.x=-Math.PI/2;rug.position.set(-2,FLOOR_Y+0.03,2.5);base.add(rug);

 var wallMat=new THREE.MeshPhysicalMaterial({color:0xbfd8ff,transparent:true,opacity:0.14,roughness:0.08,metalness:0,side:THREE.DoubleSide});
 var dome=new THREE.Mesh(new THREE.SphereGeometry(R,40,20,0,Math.PI*2,0,Math.PI/2),wallMat);
 dome.position.y=FLOOR_Y;base.add(dome);
 var rim=new THREE.Mesh(new THREE.TorusGeometry(R,0.22,10,48),new THREE.MeshStandardMaterial({color:0x8a93a5,metalness:0.7,roughness:0.35}));
 rim.rotation.x=Math.PI/2;rim.position.y=FLOOR_Y;base.add(rim);
 for(var i=0;i<10;i++){
  var a=i/10*Math.PI*2;
  var rib=new THREE.Mesh(new THREE.TorusGeometry(R,0.09,6,30,Math.PI/2),new THREE.MeshStandardMaterial({color:0x9aa3b5,metalness:0.7,roughness:0.35}));
  rib.rotation.y=a;rib.rotation.z=-Math.PI/2;
  rib.rotation.x=0;
  rib.position.y=FLOOR_Y;
  rib.rotation.set(Math.PI/2,0,a-Math.PI/2);
  base.add(rib);
 }
 var cap=new THREE.Mesh(new THREE.SphereGeometry(1.1,16,12),new THREE.MeshStandardMaterial({color:0x88ddff,emissive:0x2288aa,emissiveIntensity:0.7,metalness:0.6,roughness:0.2}));
 cap.position.y=FLOOR_Y+H+0.6;base.add(cap);
 var capLight=new THREE.PointLight(0xaaddff,0.7,26);capLight.position.copy(cap.position);base.add(capLight);

 for(var i=0;i<4;i++){
  var a=i/4*Math.PI*2+0.4;
  var lt=new THREE.PointLight(0xfff2dd,0.55,17);
  lt.position.set(Math.cos(a)*5,FLOOR_Y+H-0.5,Math.sin(a)*5);
  base.add(lt);interiorLights.push(lt);
  var bulb=new THREE.Mesh(new THREE.SphereGeometry(0.16,8,8),new THREE.MeshBasicMaterial({color:0xfff4cf}));
  bulb.position.copy(lt.position);base.add(bulb);
 }

 var consoleGrp=new THREE.Group();
 var desk=new THREE.Mesh(new THREE.BoxGeometry(3.6,1,1.1),new THREE.MeshStandardMaterial({color:0x39404e,metalness:0.55,roughness:0.4}));
 desk.position.y=0.5;desk.castShadow=true;consoleGrp.add(desk);
 var scrColors=[0x33ccff,0xff9944,0x66ff99];
 for(var i=-1;i<=1;i++){
  var scr=new THREE.Mesh(new THREE.PlaneGeometry(1.05,0.72),new THREE.MeshBasicMaterial({color:scrColors[i+1]}));
  scr.position.set(i*1.18,1.35,-0.1);
  scr.rotation.x=-0.28;
  consoleGrp.add(scr);
  var frame=new THREE.Mesh(new THREE.BoxGeometry(1.18,0.85,0.06),new THREE.MeshStandardMaterial({color:0x23272f}));
  frame.position.set(i*1.18,1.35,-0.14);frame.rotation.x=-0.28;consoleGrp.add(frame);
  var gl=new THREE.PointLight(scrColors[i+1],0.5,4);gl.position.set(i*1.18,1.4,0.4);consoleGrp.add(gl);
 }
 consoleGrp.position.set(0,FLOOR_Y,-6.2);
 consoleGrp.rotation.y=0;
 base.add(consoleGrp);
 registerInteract(consoleGrp,3.2,'🖥 主控制台','切換室內燈光模式',function(){
  var warm=interiorLights[0].color.getHex()===0xfff2dd;
  for(var i=0;i<interiorLights.length;i++){
   interiorLights[i].color.setHex(warm?0x66bbff:0xfff2dd);
   interiorLights[i].intensity=warm?0.7:0.55;
  }
  toast(warm?'💡 切換至「深空藍」照明模式':'💡 切換至「暖白」照明模式');
 });

 var bedGrp=new THREE.Group();
 var bedFrame=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.42,0.94),new THREE.MeshStandardMaterial({color:0x59627a,metalness:0.4,roughness:0.5}));
 bedFrame.castShadow=true;bedGrp.add(bedFrame);
 var mattress=new THREE.Mesh(new THREE.BoxGeometry(1.78,0.18,0.84),new THREE.MeshStandardMaterial({color:0xdde4f2,roughness:0.9}));
 mattress.position.y=0.3;mattress.castShadow=true;bedGrp.add(mattress);
 var pillow=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.12,0.6),new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.95}));
 pillow.position.set(-0.6,0.44,0);pillow.castShadow=true;bedGrp.add(pillow);
 var blanket=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.06,0.86),new THREE.MeshStandardMaterial({color:0x4477cc,roughness:0.9}));
 blanket.position.set(0.3,0.41,0);bedGrp.add(blanket);
 bedGrp.position.set(-7.6,FLOOR_Y+0.21,-3.4);bedGrp.rotation.y=Math.PI/2;
 base.add(bedGrp);
 var bed2=bedGrp.clone();bed2.position.set(-7.6,FLOOR_Y+1.5,-3.4);base.add(bed2);
 var ladderStep=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.08,0.3),new THREE.MeshStandardMaterial({color:0x8a93a5}));
 ladderStep.position.set(-7.2,FLOOR_Y+0.7,-3.4);ladderStep.rotation.z=0.5;base.add(ladderStep);
 registerInteract(bedGrp,2.6,'🛠 太空臥鋪','小睡一會兒',function(){
  var f=document.getElementById('fade');f.style.opacity=1;
  setTimeout(function(){toast('😴 睡了一覺，夢到地球…');f.style.opacity=0;},900);
 });

 var tbl=new THREE.Group();
 var top=new THREE.Mesh(new THREE.CylinderGeometry(1,1,0.09,24),new THREE.MeshStandardMaterial({color:0xe8ecf4,roughness:0.35,metalness:0.2}));
 top.castShadow=true;tbl.add(top);
 var leg=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.14,0.74,12),new THREE.MeshStandardMaterial({color:0x6a7386,metalness:0.6,roughness:0.35}));
 leg.position.y=-0.42;leg.castShadow=true;tbl.add(leg);
 tbl.children[0].position.y=0.76;
 tbl.position.set(2.6,FLOOR_Y,3.4);base.add(tbl);
 var cup=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.05,0.14,10),new THREE.MeshStandardMaterial({color:0xff7799,roughness:0.6}));
 cup.position.set(0.3,0.87,0.2);tbl.add(cup);
 for(var i=0;i<2;i++){
  var chair=new THREE.Group();
  var cs=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.07,0.46),new THREE.MeshStandardMaterial({color:0x7d8698,metalness:0.4,roughness:0.5}));
  chair.add(cs);
  var cb=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.55,0.07),new THREE.MeshStandardMaterial({color:0x7d8698,metalness:0.4,roughness:0.5}));
  cb.position.set(0,0.3,-0.2);chair.add(cb);
  var cl=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.06,0.4,8),new THREE.MeshStandardMaterial({color:0x555c6a}));
  cl.position.y=-0.23;chair.add(cl);
  chair.position.set(2.6+(i===0?-1.5:1.5),FLOOR_Y+0.42,3.4+(i===0?0:0));
  chair.children[0].position.y=0;chair.position.y=FLOOR_Y+0.21;
  chair.lookAt(tbl.position.x,FLOOR_Y+0.21,tbl.position.z);
  base.add(chair);
 }

 var hyd=new THREE.Group();
 var shelf=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.1,0.9),new THREE.MeshStandardMaterial({color:0x4a5568,metalness:0.5,roughness:0.4}));
 hyd.add(shelf);
 var grow=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.05,0.7),new THREE.MeshBasicMaterial({color:0xff66dd}));
 grow.position.y=0.75;hyd.add(grow);
 var glowL=new THREE.PointLight(0xff66dd,0.8,6);glowL.position.y=0.6;hyd.add(glowL);
 for(var i=-1;i<=1;i++){
  var pot=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.12,0.22,10),new THREE.MeshStandardMaterial({color:0x8a6a4a,roughness:0.8}));
  pot.position.set(i*0.8,0.16,0);pot.castShadow=true;hyd.add(pot);
  var leaf=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,8),new THREE.MeshStandardMaterial({color:0x44bb55,roughness:0.7,flatShading:true}));
  leaf.position.set(i*0.8,0.42,0);leaf.scale.y=1.5;leaf.castShadow=true;hyd.add(leaf);
  var stem=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.03,0.24,6),new THREE.MeshStandardMaterial({color:0x2d7a38}));
  stem.position.set(i*0.8,0.28,0);hyd.add(stem);

 var tankR=tankL.clone();tankR.position.x=0.12;g.add(tankR);
 var armL=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.44,8),suitM);
 armL.position.set(-0.33,0.76,0);armL.castShadow=true;g.add(armL);
 var armR=armL.clone();armR.position.x=0.33;g.add(armR);
 var legL=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.36,8),suitM);
 legL.position.set(-0.13,0.18,0);legL.castShadow=true;g.add(legL);
 var legR=legL.clone();legR.position.x=0.13;g.add(legR);
 g.userData={armL:armL,armR:armR,legL:legL,legR:legR,body:body};
 g.position.copy(playerPos);
 scene.add(g);
 player=g;
}

function init(){
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(window.innerWidth,window.innerHeight);
 renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.12;
 renderer.domElement.className='gl';
 document.body.insertBefore(renderer.domElement,document.body.firstChild);
 clock=new THREE.Clock();
 buildWorld();
 buildPlayer();

 var dragS=null,moved=false;
 document.addEventListener('mousedown',function(e){dragS={x:e.clientX,y:e.clientY};moved=false;});
 document.addEventListener('mousemove',function(e){
  if(!dragS)return;
  var dx=e.clientX-dragS.x,dy=e.clientY-dragS.y;
  if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
  if(moved){
   camTheta-=dx*0.0045;
   camPhi=Math.max(-0.3,Math.min(1.2,camPhi-dy*0.0045));
   dragS={x:e.clientX,y:e.clientY};
  }
 });
 document.addEventListener('mouseup',function(){dragS=null;});
 document.addEventListener('wheel',function(e){camDist=Math.max(2.5,Math.min(15,camDist+e.deltaY*0.01));},{passive:true});
 window.addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(e.code==='KeyE')doInteract();
 });
 window.addEventListener('keyup',function(e){keys[e.code]=false;});
 document.addEventListener('contextmenu',function(e){e.preventDefault();});
 document.getElementById('title').addEventListener('click',function(){
  this.classList.add('hide');
 });
 window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
 });

 camera=new THREE.PerspectiveCamera(62,window.innerWidth/window.innerHeight,0.1,1000);
 animate();
}

function doInteract(){
 if(driving){stopDrive();return;}
 if(nearObj)nearObj.fn();
}

var animT=0;
function animate(){
 requestAnimationFrame(animate);
 var dt=Math.min(clock.getDelta(),0.05);
 animT+=dt;
 var t=animT;

 if(!driving)updatePlayer(dt,t);
 else updateRoverDrive(dt);

  if(earthMesh)earthMesh.rotation.y+=dt*0.02;
  var drone=window._moonDrone;
  if(drone){
   for(var bi=0;bi<drone.userData.blades.length;bi++)drone.userData.blades[bi].rotation.z+=dt*45;
   if(drone.userData.flyTime>0){
    drone.userData.flyTime-=dt;
    var ft=4-drone.userData.flyTime;
    var dr=16+Math.sin(ft*1.2)*12;
    var da=ft*0.8;
    drone.position.set(Math.cos(da)*dr,terrainH(Math.cos(da)*dr,-38)+3+Math.sin(ft*2)*0.8,Math.sin(da)*dr-38);
    drone.rotation.y=-da;
   }else{
    var dr2=16+Math.sin(t*0.3)*0.5;
    var da2=t*0.15;
    drone.position.x=Math.cos(da2)*dr2;
    drone.position.z=Math.sin(da2)*dr2-38;
    drone.position.y=terrainH(drone.position.x,drone.position.z)+3+Math.sin(t*1.5)*0.3;
    drone.rotation.y=-da2;
   }
  }
  if(window._holoMarkers){
   for(var hi=0;hi<window._holoMarkers.length;hi++){
    var hm=window._holoMarkers[hi];
    var it=interactables[hm.mesh.userData.idx];
    var wp=new THREE.Vector3();it.obj.getWorldPosition(wp);
    hm.mesh.position.x=wp.x;
    hm.mesh.position.z=wp.z;
    hm.mesh.position.y=hm.baseY+Math.sin(t*1.8+hi*0.7)*0.2;
    var d=Math.hypot(wp.x-playerPos.x,wp.z-playerPos.z);
    hm.mesh.material.opacity=d<it.r?0.9:0.35+Math.sin(t*2.2+hi)*0.15;
    hm.mesh.scale.setScalar(d<it.r?1.3:1);
   }
  }
 if(flagWave>0||true){
  var amp=0.06+flagWave*0.35;
  flagWave=Math.max(0,flagWave-dt*0.4);
  var p=flagCloth.mesh.geometry.attributes.position,b=flagCloth.base;
  for(var i=0;i<p.count;i++){
   var bx=b.getX(i);
   p.setZ(i,Math.sin(bx*3+t*3.2)*amp*(bx/1.8+0.05)*1.6);
  }
  p.needsUpdate=true;
 }

 var camTarget=driving?rover.grp.position:player.position;
 var focusY=(driving?1.6:1.2);
 var cx=camTarget.x+camDist*Math.sin(camTheta)*Math.cos(camPhi);
 var cz=camTarget.z+camDist*Math.cos(camTheta)*Math.cos(camPhi);
 var cy=camTarget.y+focusY+camDist*Math.sin(camPhi);
 var groundMin=terrainH(cx,cz)+0.5;
 if(cy<groundMin)cy=groundMin;
 camera.position.lerp(new THREE.Vector3(cx,cy,cz),Math.min(1,dt*8));
 camera.lookAt(camTarget.x,camTarget.y+focusY,camTarget.z);

 updatePrompt();
 renderer.render(scene,camera);
}

function updatePlayer(dt,t){
 var fwd=new THREE.Vector3(Math.sin(camTheta),0,Math.cos(camTheta)).multiplyScalar(-1);
 var rgt=new THREE.Vector3(fwd.z,0,-fwd.x);
 var md=new THREE.Vector3();
 if(keys['KeyW'])md.add(fwd);if(keys['KeyS'])md.sub(fwd);
 if(keys['KeyA'])md.sub(rgt);if(keys['KeyD'])md.add(rgt);
 var moving=md.lengthSq()>0.01;
 var spd=keys['ShiftLeft']||keys['ShiftRight']?9:5.5;
 if(moving){
  md.normalize();
  var targetYaw=Math.atan2(md.x,md.z);
  var dy=targetYaw-playerYaw;
  while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;
  playerYaw+=dy*Math.min(1,dt*10);
 }
 var nx=playerPos.x+md.x*spd*dt,nz=playerPos.z+md.z*spd*dt;
 playerPos.x=nx;playerPos.z=nz;

 var gh=terrainH(playerPos.x,playerPos.z);
 var jetting=!onGround&&keys['Space'];
 if(jetting){
  playerVel.y+=JET_V*dt;
  playerVel.y=Math.min(playerVel.y,5.5);
 }else{
  playerVel.y-=GRAV*dt;
 }
 playerPos.y+=playerVel.y*dt;
 if(playerPos.y<=gh){
  playerPos.y=gh;
  if(playerVel.y<-3&&!onGround)toast('🌙 輕柔落地 — 這就是月球重力');
  playerVel.y=0;onGround=true;
 }else onGround=false;

 if(onGround&&keys['Space']){
  playerVel.y=JUMP_V;onGround=false;
 }

 player.position.copy(playerPos);
 player.rotation.y=playerYaw;
 var ud=player.userData;
 if(moving&&onGround){
  var wt=t*9;
  ud.armL.rotation.x=Math.sin(wt)*0.6;ud.armR.rotation.x=-Math.sin(wt)*0.6;
  ud.legL.rotation.x=-Math.sin(wt)*0.6;ud.legR.rotation.x=Math.sin(wt)*0.6;
 }else if(!onGround){
  var fl=Math.sin(t*3)*0.15;
  ud.armL.rotation.x=-0.5+fl;ud.armR.rotation.x=-0.5-fl;
  ud.legL.rotation.x=fl;ud.legR.rotation.x=-fl;
 }else{
  ['armL','armR','legL','legR'].forEach(function(k){ud[k].rotation.x*=0.9;});
 }
}

function updateRoverDrive(dt){
 var acc=(keys['KeyW']?14:0)-(keys['KeyS']?9:0);
 rover.speed+=(acc-rover.speed*1.8)*dt;
 rover.speed=Math.max(-6,Math.min(14,rover.speed));
 var targetYaw=-camTheta;
 var dy=targetYaw-rover.yaw;
 while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;
 rover.yaw+=dy*Math.min(1,dt*4);
 var nx=rover.grp.position.x+Math.sin(rover.yaw)*rover.speed*dt;
 var nz=rover.grp.position.z-Math.cos(rover.yaw)*rover.speed*dt;
 var dCenter=Math.hypot(nx,nz);
 if(dCenter<12.5){nx+= (nx/Math.max(dCenter,0.01))*(12.5-dCenter);nz+=(nz/Math.max(dCenter,0.01))*(12.5-dCenter);}
 rover.grp.position.x=nx;rover.grp.position.z=nz;
 rover.grp.position.y=terrainH(nx,nz)+0.02;
 var ahead=terrainH(nx+Math.sin(rover.yaw)*1.4,nz-Math.cos(rover.yaw)*1.4);
 var pitch=Math.atan2(ahead-terrainH(nx,nz),1.4)*0.6;
 rover.grp.rotation.order='YXZ';
 rover.grp.rotation.y=rover.yaw;
 rover.grp.rotation.x=-pitch;
 for(var i=0;i<rover.wheels.length;i++)rover.wheels[i].rotation.x+=rover.speed*dt*2;
}

function updatePrompt(){
 var pr=document.getElementById('prompt');
 nearObj=null;
 if(!driving){
  var best=1e9;
  for(var i=0;i<interactables.length;i++){
   var it=interactables[i];
   var wp=new THREE.Vector3();it.obj.getWorldPosition(wp);
   var d=Math.hypot(wp.x-playerPos.x,wp.z-playerPos.z);
   if(d<it.r&&d<best){best=d;nearObj=it;}
  }
 }
 if(nearObj){
  pr.innerHTML='<b style="color:#ffd97a">E</b>　'+nearObj.label+' — '+nearObj.desc;
  pr.style.display='block';
 }else if(!driving){
  pr.style.display='none';
 }else{
  pr.innerHTML='<b style="color:#ffd97a">E</b>　下車';
  pr.style.display='block';
 }
}

init();
</script>
</body>
</html>
