<!DOCTYPE html><html><body><script>
var WS_URL='ws://localhost:3000';
var ws=null;
function connect(){
  if(ws)try{ws.close()}catch(e){}
  ws=new WebSocket(WS_URL);
  ws.onopen=function(){
    parent.postMessage({type:'relay_status',connected:true},'*');
    if(pendingQueue){for(var i=0;i<pendingQueue.length;i++)ws.send(pendingQueue[i]);pendingQueue=null;}
  };
  ws.onmessage=function(e){
    parent.postMessage({type:'relay_msg',data:e.data},'*');
  };
  ws.onclose=function(){
    parent.postMessage({type:'relay_status',connected:false},'*');
  };
  ws.onerror=function(){
    parent.postMessage({type:'relay_status',connected:false,error:true},'*');
  };
}
var pendingQueue=null;
window.addEventListener('message',function(e){
  var msg=e.data;
  if(msg.type==='relay_send'){
    var raw=JSON.stringify(msg.payload);
    if(ws&&ws.readyState===1){ws.send(raw);}
    else{
      if(!pendingQueue)pendingQueue=[];
      pendingQueue.push(raw);
    }
  }
});
connect();
</script></body></html>
