<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>射靶得分 — 派對小遊戲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI','Microsoft YaHei',sans-serif;user-select:none}
canvas{display:block}

#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#score{position:absolute;top:20px;left:20px;color:#fff;font-size:28px;font-weight:bold;letter-spacing:2px;text-shadow:0 0 20px rgba(0,0,0,.8)}
#score span{color:#fd0}
#timer{position:absolute;top:20px;right:20px;color:#fff;font-size:28px;font-weight:bold;letter-spacing:2px;text-shadow:0 0 20px rgba(0,0,0,.8)}
#timer.warning{color:#f44}
#combo{position:absolute;top:70px;left:20px;color:#fd0;font-size:18px;font-weight:bold;letter-spacing:2px;text-shadow:0 0 15px rgba(255,200,0,.5);opacity:0;transition:opacity .3s}
#combo.show{opacity:1}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:11}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.6)}
#crosshair::before{width:2px;height:16px;left:-1px;top:-8px}
#crosshair::after{width:16px;height:2px;top:-1px;left:-8px}

#start-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;cursor:pointer}
#start-screen h1{font-size:3em;color:#fd0;letter-spacing:8px;margin-bottom:8px;text-shadow:0 0 40px rgba(255,200,0,.3)}
#start-screen .sub{color:rgba(255,255,255,.4);font-size:1em;letter-spacing:3px;margin-bottom:30px}
#start-screen .hint{color:rgba(255,255,255,.2);font-size:.85em;letter-spacing:2px}
#start-screen .controls{margin-top:20px;display:flex;gap:30px;color:rgba(255,255,255,.3);font-size:.8em;letter-spacing:1px}
#start-screen .controls span{display:flex;align-items:center;gap:6px}

#result-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20}
#result-box{background:linear-gradient(135deg,#1a1a2a,#0a0a1a);border:1px solid rgba(255,200,0,.2);border-radius:16px;padding:40px 50px;text-align:center;max-width:380px;width:90%}
#result-box .title{font-size:28px;color:#fd0;letter-spacing:6px;margin-bottom:4px;text-shadow:0 0 30px rgba(255,200,0,.2)}
#result-box .sub{font-size:14px;color:rgba(255,255,255,.4);letter-spacing:2px;margin-bottom:20px}
#result-box .stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:16px;color:rgba(255,255,255,.6)}
#result-box .stat .val{color:#fff;font-weight:bold}
#result-box .stat .val.highlight{color:#fd0;font-size:22px}
#result-box .btn{margin-top:24px;padding:14px 40px;font-size:16px;font-weight:bold;color:#fff;background:rgba(255,200,0,.15);border:1px solid rgba(255,200,0,.3);border-radius:8px;cursor:pointer;letter-spacing:4px;transition:all .3s;pointer-events:auto}
#result-box .btn:hover{background:rgba(255,200,0,.25);border-color:#fd0;box-shadow:0 0 30px rgba(255,200,0,.15)}
#result-box .btn.secondary{margin-top:10px;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.15);font-size:13px}
#result-box .btn.secondary:hover{background:rgba(255,255,255,.1)}
</style>
</head>
<body>

<div id="crosshair"></div>

<div id="ui">
<div id="score">🎯 得分: <span id="score-val">0</span></div>
<div id="timer">⏱ <span id="timer-val">30</span>s</div>
<div id="combo"></div>
</div>

<div id="start-screen">
<h1>🎯 射 靶 得 分</h1>
<div class="sub">限時 30 秒 · 射中越多越高分</div>
<div class="controls">
<span>🖱 滑鼠瞄準</span>
<span>🔫 左鍵射擊</span>
<span>⌨ WASD 移動</span>
<span>🏃 Shift 跑步</span>
</div>
<div style="margin-top:24px;display:flex;gap:24px;color:rgba(255,255,255,.3);font-size:.8em;letter-spacing:1px">
<span style="color:#fd0">★ 金 +50</span>
<span style="color:#f44">★ 紅 +30</span>
<span style="color:#ccc">★ 白 +10</span>
</div>
<div class="hint" style="margin-top:30px">點擊開始</div>
</div>

<div id="result-overlay">
<div id="result-box">
<div class="title">🎯 時間到！</div>
<div class="sub" id="result-sub">結算</div>
<div class="stat">總得分 <span class="val highlight" id="result-score">0</span></div>
<div class="stat">命中次數 <span class="val" id="result-hits">0</span></div>
<div class="stat" id="result-accuracy-wrap">命中率 <span class="val" id="result-accuracy">0%</span></div>
<div class="stat">最高連擊 <span class="val" id="result-combo">0</span></div>
<button class="btn" onclick="restartGame()">🔄 再玩一次</button>
<button class="btn secondary" onclick="closeGame()">✕ 關閉</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ========== SETUP ==========
const GAME_DURATION = 30;
const TARGET_SPAWN_MIN = 0.6;
const TARGET_SPAWN_MAX = 1.2;
const TARGET_LIFETIME_MIN = 2.0;
const TARGET_LIFETIME_MAX = 3.5;
const SPAWN_RANGE_MIN = 10;
const SPAWN_RANGE_MAX = 28;
const SPAWN_Y_MIN = 1.5;
const SPAWN_Y_MAX = 5;
const SPAWN_X_SPREAD = 8;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 35, 50);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2, 3);
camera.lookAt(0, 2.5, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ========== LIGHTING ==========
const ambient = new THREE.AmbientLight(0x404060, 0.5);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x87ceeb, 0x3a2a1a, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffeedd, 1.0);
sun.position.set(30, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
const d = 25;
sun.shadow.camera.left = -d;
sun.shadow.camera.right = d;
sun.shadow.camera.top = d;
sun.shadow.camera.bottom = -d;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8888ff, 0.3);
fill.position.set(-20, 15, -10);
scene.add(fill);

// ========== ENVIRONMENT ==========
const M = (c, o) => new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.6,metalness:0.1}, o||{}));

// Ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), M(0x2a2a3a,{roughness:0.8,metalness:0}));
ground.rotation.x = -Math.PI/2;
ground.position.set(0, -0.01, 15);
ground.receiveShadow = true;
scene.add(ground);

// Grid lines on ground
const grid = new THREE.Group();
for (let i = 0; i < 15; i++) {
  const z = i * 3 + 1;
  const line = new THREE.Mesh(new THREE.PlaneGeometry(20, 0.04), M(0x333355,{transparent:true,opacity:0.3,roughness:1,metalness:0}));
  line.rotation.x = -Math.PI/2;
  line.position.set(0, 0.001, z);
  grid.add(line);
}
scene.add(grid);

// Back wall
const wall = new THREE.Mesh(new THREE.BoxGeometry(24, 8, 0.5), M(0x222244,{roughness:0.9,metalness:0}));
wall.position.set(0, 4, 28);
wall.receiveShadow = true;
wall.castShadow = true;
scene.add(wall);

// Wall details - panels
for (let x = -10; x <= 10; x += 4) {
  for (let y = 1; y <= 6; y += 2.5) {
    const panel = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.5, 0.08), M(0x2a2a4a,{roughness:0.7,metalness:0.2}));
    panel.position.set(x, y, 28.2);
    scene.add(panel);
  }
}

// Side walls (open range feel)
for (let side of [-1, 1]) {
  const sw = new THREE.Mesh(new THREE.BoxGeometry(0.3, 5, 25), M(0x222244,{roughness:0.9,metalness:0}));
  sw.position.set(side * 12, 2.5, 15);
  scene.add(sw);
}

// Shooting platform
const plat = new THREE.Mesh(new THREE.BoxGeometry(4, 0.2, 2.5), M(0x333355,{roughness:0.5,metalness:0.2}));
plat.position.set(0, 0, 0);
plat.receiveShadow = true;
plat.castShadow = true;
scene.add(plat);

// Railing
for (let side of [-1, 1]) {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.5, 2.2), M(0x666688,{metalness:0.4,roughness:0.3}));
  rail.position.set(side * 1.8, 0.5, 0);
  scene.add(rail);
}

// Distance markers on ground
for (let z = 5; z <= 25; z += 5) {
  const marker = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.3), M(0x444466,{transparent:true,opacity:0.5,roughness:1,metalness:0}));
  marker.rotation.x = -Math.PI/2;
  marker.position.set(0, 0.002, z);
  scene.add(marker);
  // Small post
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.2, 4), M(0x555577,{metalness:0.3,roughness:0.4}));
  post.position.set(0, 0.1, z);
  scene.add(post);
  // Distance text using sprite
  var canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 32;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.font = '20px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(z+'m', 32, 16);
  var tex = new THREE.CanvasTexture(canvas);
  var sprite = new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  sprite.position.set(0, 0.3, z);
  sprite.scale.set(1.5, 0.75, 1);
  scene.add(sprite);
}

// ========== TARGET SYSTEM ==========
var targets = [];
var activeTargets = [];
var score = 0;
var hits = 0;
var totalShots = 0;
var combo = 0;
var maxCombo = 0;
var timeLeft = GAME_DURATION;
var gameRunning = false;
var spawnTimer = 0;

const TARGET_COLORS = {
  gold: { color: 0xffd700, emissive: 0x886600, points: 50, name: '金', scale: 0.5 },
  red:  { color: 0xff4444, emissive: 0x882222, points: 30, name: '紅', scale: 0.45 },
  white:{ color: 0xcccccc, emissive: 0x666666, points: 10, name: '白', scale: 0.4 },
};
const TARGET_TYPES = ['gold', 'red', 'white'];
const TARGET_WEIGHTS = [0.15, 0.35, 0.50];

function pickTargetType() {
  var r = Math.random();
  var cum = 0;
  for (var i = 0; i < TARGET_TYPES.length; i++) {
    cum += TARGET_WEIGHTS[i];
    if (r < cum) return TARGET_TYPES[i];
  }
  return 'white';
}

function createTarget(type) {
  var info = TARGET_COLORS[type];
  var g = new THREE.Group();

  // Main disc
  var disc = new THREE.Mesh(
    new THREE.CircleGeometry(info.scale, 24),
    new THREE.MeshStandardMaterial({
      color: info.color,
      emissive: info.emissive,
      emissiveIntensity: 0.3,
      roughness: 0.4,
      metalness: 0.3,
      side: THREE.DoubleSide
    })
  );
  disc.position.set(0, 0, 0);
  g.add(disc);

  // Ring border
  var ring = new THREE.Mesh(
    new THREE.RingGeometry(info.scale * 0.85, info.scale, 24),
    new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: info.emissive,
      emissiveIntensity: 0.1,
      roughness: 0.5,
      metalness: 0.2,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.2
    })
  );
  ring.position.set(0, 0, 0.01);
  g.add(ring);

  // Back support
  var pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.03, 0.03, 0.3, 6),
    new THREE.MeshStandardMaterial({color: 0x444466, metalness: 0.4, roughness: 0.3})
  );
  pole.position.set(0, -info.scale - 0.15, -0.05);
  g.add(pole);

  // Glow (point light for gold)
  if (type === 'gold') {
    var glow = new THREE.PointLight(0xffd700, 0.5, 4);
    glow.position.set(0, 0, 0.5);
    g.add(glow);
  }

  // Spawn position
  var dist = SPAWN_RANGE_MIN + Math.random() * (SPAWN_RANGE_MAX - SPAWN_RANGE_MIN);
  var height = SPAWN_Y_MIN + Math.random() * (SPAWN_Y_MAX - SPAWN_Y_MIN);
  var xOff = (Math.random() - 0.5) * SPAWN_X_SPREAD;

  g.position.set(xOff, height, dist);
  // Face toward player
  g.lookAt(0, 2, 3);

  // Random slight rotation variation
  g.rotation.y += (Math.random() - 0.5) * 0.3;
  g.rotation.x += (Math.random() - 0.5) * 0.1;

  scene.add(g);

  var lifetime = TARGET_LIFETIME_MIN + Math.random() * (TARGET_LIFETIME_MAX - TARGET_LIFETIME_MIN);

  var targetData = {
    mesh: g,
    type: type,
    points: info.points,
    color: info.color,
    lifetime: lifetime,
    timer: 0,
    alive: true,
    scale: info.scale,
    hitAnim: 0,
  };

  targets.push(targetData);
  return targetData;
}

function removeTarget(t) {
  if (!t || !t.alive) return;
  t.alive = false;
  if (t.mesh.parent) scene.remove(t.mesh);
  // Dispose
  t.mesh.children.forEach(function(c) {
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
  });
}

// ========== SHOOTING ==========
var mouseDown = false;
var shootCooldown = 0;
var muzzleFlash = null;
var muzzleLight = null;
var hitEffects = [];

function initGun() {
  // Simple gun model in hand
  var gun = new THREE.Group();
  var gMat = new THREE.MeshStandardMaterial({color:0x555577,metalness:0.5,roughness:0.3});
  var gMat2 = new THREE.MeshStandardMaterial({color:0x333344,metalness:0.3,roughness:0.5});

  // Barrel
  var barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, 0.35, 8), gMat);
  barrel.rotation.x = Math.PI/2;
  barrel.position.set(0, 0, -0.2);
  gun.add(barrel);

  // Body
  var body = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.07, 0.15), gMat2);
  body.position.set(0, 0, 0.05);
  gun.add(body);

  // Grip
  var grip = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.08, 0.04), gMat2);
  grip.position.set(0, -0.07, 0.08);
  grip.rotation.x = 0.2;
  gun.add(grip);

  // Magazine
  var mag = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.06, 0.025), gMat2);
  mag.position.set(0, -0.05, 0);
  gun.add(mag);

  gun.position.set(0.25, -0.2, -0.4);
  camera.add(gun);

  // Muzzle flash
  muzzleFlash = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 6, 6),
    new THREE.MeshBasicMaterial({color:0xffaa44, transparent: true, opacity: 0})
  );
  muzzleFlash.position.set(0.25, -0.2, -0.8);
  camera.add(muzzleFlash);

  muzzleLight = new THREE.PointLight(0xffaa44, 0, 3);
  muzzleLight.position.set(0.25, -0.2, -0.8);
  camera.add(muzzleLight);
}

function shoot() {
  if (!gameRunning) return;
  totalShots++;

  // Muzzle flash
  muzzleFlash.material.opacity = 1;
  muzzleLight.intensity = 3;
  setTimeout(function() {
    muzzleFlash.material.opacity = 0;
    muzzleLight.intensity = 0;
  }, 50);

  // Raycast from center of screen
  var ray = new THREE.Raycaster();
  ray.set(camera.position, camera.getWorldDirection(new THREE.Vector3()));

  // Check targets
  var hitTarget = null;
  var hitDist = Infinity;
  for (var i = 0; i < targets.length; i++) {
    var t = targets[i];
    if (!t.alive) continue;
    var intersects = ray.intersectObjects(t.mesh.children, true);
    if (intersects.length > 0 && intersects[0].distance < hitDist) {
      hitTarget = t;
      hitDist = intersects[0].distance;
    }
  }

  if (hitTarget) {
    hits++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    score += hitTarget.points;
    updateUI();

    // Hit effect
    var hitPos = new THREE.Vector3();
    var dir = camera.getWorldDirection(new THREE.Vector3());
    hitPos.copy(camera.position).add(dir.clone().multiplyScalar(hitDist));

    // Flash
    var flash = new THREE.PointLight(hitTarget.color, 2, 3);
    flash.position.copy(hitPos);
    scene.add(flash);
    setTimeout(function() { scene.remove(flash); }, 80);

    // Particle burst
    createHitParticles(hitPos, hitTarget.color);

    // Combo display
    showCombo(combo);

    // Remove target
    removeTarget(hitTarget);
  } else {
    // Miss - no penalty, just visual
    combo = 0;
    showCombo(0);
  }
}

function createHitParticles(pos, color) {
  var count = 8;
  for (var i = 0; i < count; i++) {
    var p = new THREE.Mesh(
      new THREE.SphereGeometry(0.02, 4, 4),
      new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 1})
    );
    p.position.copy(pos);
    var vel = new THREE.Vector3(
      (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * 2
    );
    scene.add(p);
    hitEffects.push({mesh: p, vel: vel, life: 0.4});
  }
}

function showCombo(val) {
  var el = document.getElementById('combo');
  if (val >= 2) {
    el.textContent = '🔥 ' + val + ' 連擊！';
    el.className = 'show';
    clearTimeout(el._timer);
    el._timer = setTimeout(function() { el.className = ''; }, 800);
  } else {
    el.className = '';
  }
}

// ========== UI ==========
function updateUI() {
  document.getElementById('score-val').textContent = score;
  document.getElementById('timer-val').textContent = Math.ceil(timeLeft);
  if (timeLeft <= 5) {
    document.getElementById('timer').className = 'warning';
  }
}

// ========== TARGET SPAWNING ==========
function spawnTarget() {
  var type = pickTargetType();
  createTarget(type);
}

// ========== GAME CONTROL ==========
function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  timeLeft = GAME_DURATION;
  score = 0;
  hits = 0;
  totalShots = 0;
  combo = 0;
  maxCombo = 0;
  gameRunning = true;
  spawnTimer = 0;

  // Clear existing targets
  for (var i = targets.length - 1; i >= 0; i--) {
    removeTarget(targets[i]);
  }
  targets = [];
  hitEffects = [];

  updateUI();

  // Initial targets
  for (var i = 0; i < 3; i++) {
    setTimeout(function() { spawnTarget(); }, i * 400);
  }
}

function endGame() {
  gameRunning = false;

  // Clear remaining targets
  for (var i = targets.length - 1; i >= 0; i--) {
    removeTarget(targets[i]);
  }
  targets = [];

  var el = document.getElementById('result-overlay');
  document.getElementById('result-score').textContent = score;
  document.getElementById('result-hits').textContent = hits;
  var accuracy = totalShots > 0 ? Math.round(hits / totalShots * 100) : 0;
  document.getElementById('result-accuracy').textContent = accuracy + '%';
  document.getElementById('result-combo').textContent = maxCombo;

  // Rating
  var rating = '';
  if (score >= 300) rating = '🏆 神槍手！';
  else if (score >= 200) rating = '🥇 優秀！';
  else if (score >= 100) rating = '🥈 不錯！';
  else if (score >= 50) rating = '🥉 還行';
  else rating = '💪 繼續加油';
  document.getElementById('result-sub').textContent = rating;

  el.style.display = 'flex';
}

function restartGame() {
  document.getElementById('result-overlay').style.display = 'none';
  startGame();
}

function closeGame() {
  // Refresh to go back to clean state
  window.location.reload();
}

// ========== MOVEMENT ==========
var input = { w:false, s:false, a:false, d:false, shift:false };
var walkSpeed = 4;
var runSpeed = 7;
var playerHeight = 2;
var euler = new THREE.Euler(0, 0, 0, 'YXZ');
var pitch = 0;
var yaw = 0;
var moveVec = new THREE.Vector3();

// ========== POINTER LOCK ==========
document.getElementById('start-screen').addEventListener('click', function() {
  renderer.domElement.requestPointerLock();
});

document.addEventListener('pointerlockchange', function() {
  if (document.pointerLockElement === renderer.domElement) {
    if (!gameRunning) startGame();
  }
});

// ========== EVENTS ==========
document.addEventListener('mousedown', function(e) {
  if (e.button === 0 && document.pointerLockElement === renderer.domElement) {
    mouseDown = true;
    if (shootCooldown <= 0) {
      shoot();
      shootCooldown = 0.12;
    }
  }
});

document.addEventListener('mouseup', function(e) {
  if (e.button === 0) mouseDown = false;
});

document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

// Mouse look
document.addEventListener('mousemove', function(e) {
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, pitch));
});

// Keyboard
document.addEventListener('keydown', function(e) {
  switch (e.code) {
    case 'KeyW': input.w = true; break;
    case 'KeyS': input.s = true; break;
    case 'KeyA': input.a = true; break;
    case 'KeyD': input.d = true; break;
    case 'ShiftLeft': case 'ShiftRight': input.shift = true; break;
    case 'KeyR': if (!gameRunning) restartGame(); break;
  }
});
document.addEventListener('keyup', function(e) {
  switch (e.code) {
    case 'KeyW': input.w = false; break;
    case 'KeyS': input.s = false; break;
    case 'KeyA': input.a = false; break;
    case 'KeyD': input.d = false; break;
    case 'ShiftLeft': case 'ShiftRight': input.shift = false; break;
  }
});

// ========== ANIMATION ==========
var lastTime = performance.now();

function animate(time) {
  requestAnimationFrame(animate);
  var elapsed = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  // Cooldown
  if (shootCooldown > 0) shootCooldown -= elapsed;

  // Hold to fire
  if (mouseDown && gameRunning && shootCooldown <= 0) {
    shoot();
    shootCooldown = 0.12;
  }

  if (gameRunning) {
    // Timer
    timeLeft -= elapsed;
    updateUI();
    if (timeLeft <= 0) {
      endGame();
    }

    // Spawn targets
    spawnTimer -= elapsed;
    if (spawnTimer <= 0) {
      spawnTarget();
      spawnTimer = TARGET_SPAWN_MIN + Math.random() * (TARGET_SPAWN_MAX - TARGET_SPAWN_MIN);
    }

    // Update target lifetimes
    for (var i = targets.length - 1; i >= 0; i--) {
      var t = targets[i];
      if (!t.alive) continue;
      t.timer += elapsed;
      if (t.timer >= t.lifetime) {
        removeTarget(t);
        // Combo resets when target expires
        combo = 0;
        showCombo(0);
      } else {
        // Bobbing animation
        t.mesh.position.y += Math.sin(time * 0.002 + t.mesh.position.x) * 0.001;
        // Pulse glow for gold
        if (t.type === 'gold') {
          var children = t.mesh.children;
          for (var ci = 0; ci < children.length; ci++) {
            if (children[ci].isPointLight) {
              children[ci].intensity = 0.3 + Math.sin(time * 0.005 + t.mesh.position.x) * 0.2;
            }
          }
        }
      }
    }
  }

  // Hit particles
  for (var i = hitEffects.length - 1; i >= 0; i--) {
    var pe = hitEffects[i];
    pe.life -= elapsed;
    pe.mesh.position.add(pe.vel.clone().multiplyScalar(elapsed));
    pe.vel.y -= 2 * elapsed;
    pe.mesh.material.opacity = Math.max(0, pe.life / 0.4);
    pe.mesh.scale.setScalar(1 - (1 - pe.life / 0.4) * 0.5);
    if (pe.life <= 0) {
      scene.remove(pe.mesh);
      pe.mesh.geometry.dispose();
      pe.mesh.material.dispose();
      hitEffects.splice(i, 1);
    }
  }

  // Movement
  camera.position.y = playerHeight;
  if (document.pointerLockElement === renderer.domElement) {
    var speed = (input.shift ? runSpeed : walkSpeed) * elapsed;
    var forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    var right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    moveVec.set(0, 0, 0);
    if (input.w) moveVec.add(forward);
    if (input.s) moveVec.sub(forward);
    if (input.a) moveVec.sub(right);
    if (input.d) moveVec.add(right);
    if (moveVec.length() > 0) {
      moveVec.normalize().multiplyScalar(speed);
      camera.position.x += moveVec.x;
      camera.position.z += moveVec.z;
      camera.position.x = Math.max(-11, Math.min(11, camera.position.x));
      camera.position.z = Math.max(-2, Math.min(27, camera.position.z));
    }
    euler.set(pitch, yaw, 0);
    camera.quaternion.setFromEuler(euler);
  }

  renderer.render(scene, camera);
}

// ========== INIT ==========
initGun();
animate(performance.now());

</script>
