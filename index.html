<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OCGAME</title>
<style>
*{margin:0;padding:0}
body{overflow:hidden;background:#000;font-family:Arial}
canvas{display:block}
#blocker{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10}
#blocker div{color:#fff;font-size:24px;text-align:center;background:rgba(0,0,0,.7);padding:24px 48px;border-radius:8px;line-height:1.6}
#blocker small{font-size:14px;opacity:.7}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.8);font-size:28px;pointer-events:none;z-index:5;font-family:monospace}
#hud{position:fixed;bottom:30px;left:20px;z-index:5;pointer-events:none}
#hud>div{width:220px;height:20px;margin-bottom:5px;border:1px solid rgba(255,255,255,.3);border-radius:4px;overflow:hidden;position:relative;background:rgba(0,0,0,.6)}
#hud>div>div{height:100%}
#hud>div>span{position:absolute;right:6px;top:0;color:#fff;font-size:13px;line-height:20px;font-family:monospace}
#hp-fill{background:linear-gradient(90deg,#3a3,#5e5);width:100%}
#armor-fill{background:linear-gradient(90deg,#38c,#5af);width:100%}
#menu{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 40%,#1a0a2e,#0a0a1a 50%,#000 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;font-family:Arial;animation:bgDrift 10s ease-in-out infinite alternate}
@keyframes bgDrift{0%{background-size:100% 100%}100%{background-size:130% 130%;background-position:60% 30%}}
#menu::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(2px 2px at 15% 25%,rgba(255,68,170,.12),transparent 1px),radial-gradient(2px 2px at 75% 15%,rgba(68,255,170,.1),transparent 1px),radial-gradient(1px 1px at 45% 65%,rgba(170,68,255,.12),transparent 1px),radial-gradient(1px 1px at 80% 70%,rgba(255,136,68,.08),transparent 1px);background-size:200px 200px;pointer-events:none}
#menu::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.7));pointer-events:none;z-index:0}
#menu-sweep{position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.03),rgba(255,255,255,.06),rgba(255,255,255,.03),transparent);transform:skewX(-20deg);z-index:0;pointer-events:none;animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%,100%{left:-60%}50%{left:120%}}
#scanlines{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:31;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px)}
#menu-title{font-size:86px;font-weight:900;color:transparent;background:linear-gradient(90deg,#f4a,#4af,#4fa,#a4f);background-clip:text;-webkit-background-clip:text;letter-spacing:16px;margin-bottom:4px;z-index:1;animation:titleAnim 4s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(255,68,170,.4)) drop-shadow(0 0 60px rgba(68,170,255,.3))}
@keyframes titleAnim{0%,100%{background-position:0% 50%;filter:drop-shadow(0 0 30px rgba(255,68,170,.4)) drop-shadow(0 0 60px rgba(68,170,255,.3))}50%{background-position:100% 50%;filter:drop-shadow(0 0 30px rgba(68,255,170,.4)) drop-shadow(0 0 60px rgba(170,68,255,.3))}}
#menu-line{width:200px;height:2px;background:linear-gradient(90deg,transparent,#f4a 20%,#4af 50%,#4fa 80%,transparent);margin:12px 0 10px;z-index:1;animation:lineGlow 3s ease-in-out infinite alternate}
@keyframes lineGlow{0%{box-shadow:0 0 5px rgba(255,68,170,.3);width:140px}100%{box-shadow:0 0 25px rgba(68,255,170,.6);width:260px}}
#menu-sub{font-size:13px;color:transparent;background:linear-gradient(90deg,#f4a,#4af,#a4f);background-clip:text;-webkit-background-clip:text;letter-spacing:8px;margin-bottom:36px;z-index:1;opacity:.7;animation:subAnim 3s ease-in-out infinite alternate}
@keyframes subAnim{0%{background-position:0% 50%}100%{background-position:100% 50%}}
#play-btn{padding:16px 56px;font-size:18px;font-weight:bold;color:#f4a;background:transparent;border:2px solid rgba(255,68,170,.5);border-radius:4px;cursor:pointer;letter-spacing:8px;transition:all .3s;box-shadow:0 0 25px rgba(255,68,170,.1);z-index:1;font-family:Arial;position:relative;overflow:hidden}
#play-btn::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(transparent,rgba(255,68,170,.12),rgba(68,170,255,.08),rgba(68,255,170,.12),transparent 75%);animation:btnSpin 5s linear infinite;z-index:-1}
@keyframes btnSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
#play-btn:hover{color:#000;border-color:#f4a;box-shadow:0 0 60px rgba(255,68,170,.5),0 0 80px rgba(68,170,255,.3);transform:scale(1.08);background:linear-gradient(135deg,#f4a,#4af)}
#armory-btn{padding:8px 36px;margin-top:10px;font-size:13px;font-weight:bold;color:#4fa;background:transparent;border:1px solid rgba(68,255,170,.3);border-radius:3px;cursor:pointer;letter-spacing:6px;transition:all .3s;font-family:Arial;opacity:.7;z-index:1}
#armory-btn:hover{opacity:1;border-color:#4fa;box-shadow:0 0 25px rgba(68,255,170,.4);transform:scale(1.04);color:#fff}
#loadout-display{display:flex;gap:8px;margin-top:14px;z-index:1}
.loadout-slot{display:flex;flex-direction:column;align-items:center;background:rgba(255,68,170,.06);border:1px solid rgba(255,68,170,.15);border-radius:4px;padding:6px 14px;min-width:60px}
.loadout-slot .slot-num{color:#a4f;font-size:10px;font-weight:bold;letter-spacing:2px}
.loadout-slot .slot-gun{color:#f8a;font-size:12px;font-weight:bold;margin-top:2px}
.menu-particle{position:fixed;border-radius:50%;pointer-events:none;z-index:29;animation:float linear infinite}
@keyframes float{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-110vh) translateX(30px);opacity:0}}
#sb{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#f62;font-size:42px;font-weight:bold;z-index:6;pointer-events:none;text-shadow:0 0 25px rgba(255,100,0,.9);display:none;font-family:Arial}
#slide-prompt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);color:#ff8;font-size:18px;font-weight:bold;z-index:6;pointer-events:none;font-family:Arial;opacity:0;transition:opacity 0.2s}
#round-clear{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);color:#4f4;font-size:48px;font-weight:bold;z-index:6;pointer-events:none;font-family:Arial;text-shadow:0 0 30px rgba(50,255,50,.8);display:none}
#round-num{position:fixed;top:40%+60px;left:50%;transform:translateX(-50%);color:#fff;font-size:22px;z-index:6;pointer-events:none;font-family:Arial;display:none}
#armory-btn{padding:8px 36px;margin-top:10px;font-size:13px;font-weight:bold;color:#4af;background:transparent;border:1px solid rgba(68,170,255,.3);border-radius:3px;cursor:pointer;letter-spacing:6px;transition:all .3s;font-family:Arial;opacity:.7;z-index:1}
#armory-btn:hover{opacity:1;border-color:#4af;box-shadow:0 0 20px rgba(68,170,255,.4);transform:scale(1.04)}
#loadout-display{display:flex;gap:8px;margin-top:14px;z-index:1}
.loadout-slot{display:flex;flex-direction:column;align-items:center;background:rgba(68,170,255,.08);border:1px solid rgba(68,170,255,.2);border-radius:4px;padding:6px 14px;min-width:60px}
.loadout-slot .slot-num{color:#4af;font-size:10px;font-weight:bold;letter-spacing:2px}
.loadout-slot .slot-gun{color:#8bf;font-size:12px;font-weight:bold;margin-top:2px}
#armory{position:fixed;top:0;left:0;width:100%;height:100%;z-index:40;font-family:Arial;display:flex;align-items:center;justify-content:center}
#armory-bg{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8)}
#armory-box{position:relative;background:linear-gradient(135deg,#0a1628,#000);border:1px solid rgba(68,170,255,.3);border-radius:8px;padding:30px 40px;display:flex;flex-direction:column;align-items:center;box-shadow:0 0 60px rgba(68,170,255,.15);max-width:420px;width:90%}
#armory-title{font-size:28px;font-weight:900;color:#4af;letter-spacing:10px;margin-bottom:24px;text-shadow:0 0 20px rgba(68,170,255,.3)}
#armory-slots{display:flex;gap:8px;width:100%;justify-content:center;margin-bottom:20px}
.a-slot{display:flex;flex-direction:column;align-items:center;background:rgba(68,170,255,.05);border:1px solid rgba(68,170,255,.15);border-radius:6px;padding:10px 16px;cursor:pointer;transition:all .3s;flex:1;max-width:110px}
.a-slot:hover{border-color:rgba(68,170,255,.4);background:rgba(68,170,255,.1)}
.a-slot.active{border-color:#4af;background:rgba(68,170,255,.15);box-shadow:0 0 15px rgba(68,170,255,.2)}
.a-slot-label{color:#667;font-size:10px;letter-spacing:2px;margin-bottom:4px}
.a-slot-gun{color:#8bf;font-size:14px;font-weight:bold}
#armory-guns-title{color:#4af;font-size:12px;letter-spacing:6px;margin-bottom:12px;opacity:.5}
#armory-guns{display:flex;gap:10px;margin-bottom:20px}
.a-gun-btn{padding:8px 20px;font-size:13px;font-weight:bold;color:#4af;background:transparent;border:1px solid rgba(68,170,255,.25);border-radius:4px;cursor:pointer;letter-spacing:3px;transition:all .3s;font-family:Arial;opacity:.7}
.a-gun-btn:hover{opacity:1;border-color:#4af;box-shadow:0 0 15px rgba(68,170,255,.3);transform:scale(1.05)}
#armory-confirm{padding:10px 40px;font-size:16px;font-weight:bold;color:#000;background:#4af;border:none;border-radius:4px;cursor:pointer;letter-spacing:6px;transition:all .3s;font-family:Arial;box-shadow:0 0 25px rgba(68,170,255,.3)}
#armory-confirm:hover{box-shadow:0 0 40px rgba(68,170,255,.6);transform:scale(1.05)}
#slot-hud{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;pointer-events:none;font-family:Arial}
#slot-hud .sh-slot{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);border-radius:3px;padding:3px 10px;font-size:11px;color:rgba(255,255,255,.5);letter-spacing:1px;transition:all .2s}
#slot-hud .sh-slot.active{color:#4af;border-color:#4af;background:rgba(68,170,255,.12)}
#ammo-hud{position:fixed;bottom:30px;right:30px;z-index:5;pointer-events:none;font-family:monospace;color:#fff;font-size:32px;font-weight:bold;text-shadow:0 0 10px rgba(0,0,0,.8)}
#plat-hud{position:fixed;top:50%;left:50%;transform:translate(-50%,-80px);z-index:6;pointer-events:none;font-family:Arial;font-size:24px;font-weight:bold;color:#4af;text-shadow:0 0 20px rgba(68,170,255,.5);display:none;letter-spacing:2px}
#ammo-sep{color:#667;margin:0 4px;font-size:24px}
#ammo-max{color:#889;font-size:24px}
#scope-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:8;display:none;font-family:Arial}
#scope-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:80px;height:80px;border:2px solid rgba(0,0,0,.8);border-radius:50%;box-shadow:0 0 0 9999px rgba(0,0,0,.6),inset 0 0 20px rgba(0,0,0,.5)}
#scope-cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
#scope-cross::before,#scope-cross::after{content:'';position:absolute;background:rgba(0,0,0,.7)}
#scope-cross::before{width:1px;height:30px;left:-0.5px;top:-15px}
#scope-cross::after{width:30px;height:1px;left:-15px;top:-0.5px}
#scope-dots{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:0;height:0}
#scope-dots::before,#scope-dots::after{content:'';position:absolute;width:2px;height:2px;background:#000;border-radius:50%}
#scope-dots::before{top:8px;left:-1px}
#scope-dots::after{top:-10px;left:-1px}
#error{display:none}
</style>
</head>
<body>
<div id="blocker">
  <div id="start-msg">點擊繼續<br><small>WASD = 移動 | Shift = 滑鏟 | Space = 跳躍 | 滑鼠 = 射擊 | 1-4 = 武器 | G = 勾爪 | R = 換彈 | ESC = 釋放滑鼠</small></div>
  <div id="error" style="display:none;color:#ff6"><div>Three.js 載入失敗。<br>執行 <b>setup.bat</b> 下載到本地，<br>或檢查網路連線。</div></div>
</div>
<div id="menu"><div id="menu-sweep"></div><div id="menu-title">OCGAME</div><div id="menu-line"></div><div id="menu-sub">C O D E   &bull;   C L I M B   &bull;   S H O O T</div><button id="play-btn">開 始 遊 戲</button><button id="armory-btn">武 器 庫</button><div id="loadout-display"><div class="loadout-slot" data-slot="0"><span class="slot-num">1</span><span class="slot-gun">AK-47</span></div><div class="loadout-slot" data-slot="1"><span class="slot-num">2</span><span class="slot-gun">─</span></div><div class="loadout-slot" data-slot="2"><span class="slot-num">3</span><span class="slot-gun">─</span></div><div class="loadout-slot" data-slot="3"><span class="slot-num">4</span><span class="slot-gun">─</span></div></div></div>
<div id="armory" style="display:none"><div id="armory-bg"></div><div id="armory-box"><div id="armory-title">武 器 庫</div><div id="armory-slots"><div class="a-slot" data-slot="0"><div class="a-slot-label">插槽 1</div><div class="a-slot-gun" data-slot="0">AK-47</div></div><div class="a-slot" data-slot="1"><div class="a-slot-label">插槽 2</div><div class="a-slot-gun" data-slot="1">─</div></div><div class="a-slot" data-slot="2"><div class="a-slot-label">插槽 3</div><div class="a-slot-gun" data-slot="2">─</div></div><div class="a-slot" data-slot="3"><div class="a-slot-label">插槽 4</div><div class="a-slot-gun" data-slot="3">─</div></div></div><div id="armory-guns-title">─ 倉 庫 ─</div><div id="armory-guns"><button class="a-gun-btn" data-gun="ak47">AK-47</button><button class="a-gun-btn" data-gun="deagle">沙鷹</button><button class="a-gun-btn" data-gun="awp">AWP</button><button class="a-gun-btn" data-gun="grapple">勾爪槍</button></div><button id="armory-confirm">確 認</button></div></div>
<div id="scope-overlay"><div id="scope-ring"></div><div id="scope-cross"></div><div id="scope-dots"></div></div>
<div id="slot-hud"></div>
<div id="ammo-hud"><span id="ammo-txt">30</span><span id="ammo-sep">/</span><span id="ammo-max">30</span></div>
<div id="plat-hud"></div>
<div id="scanlines"></div>
<div id="crosshair">+</div>
<div id="hud"><div><div id="hp-fill"></div><span id="hp-txt">100</span><span style="position:absolute;left:6px;top:0;color:#fff;font-size:13px;line-height:20px;font-family:monospace">血量</span></div><div><div id="armor-fill"></div><span id="armor-txt">0</span><span style="position:absolute;left:6px;top:0;color:#fff;font-size:13px;line-height:20px;font-family:monospace">護甲</span></div></div>
<div id="sb"></div>
<div id="slide-prompt"></div>
<div id="round-clear">通關</div>
<div id="round-num"></div>
<script>
function bootGame() {
var THREE = window.THREE;
if (!THREE) { document.getElementById('error').style.display='block'; document.getElementById('start-msg').style.display='none'; return; }

var P_RADIUS = 0.3, P_HEIGHT = 1.2, EYE_H = 0.85;
var SPEED = 8, AIR_SPEED = 5, JUMP_V = 7.7, GRAVITY = 14.8;
var WALL_CLING_TIME = 1.5, WALL_SLIDE = 0.5, WALL_JUMP_F = 10, WALL_JUMP_U = 6;
var pos = new THREE.Vector3(-10, P_HEIGHT/2 - 0.01, -10);
var vel = new THREE.Vector3();
var yaw = 0, pitch = 0, onGround = false, wallClinging = false, wallTimer = 0, wallJumpCD = 0;
var wallNormal = new THREE.Vector3();
var pSize = new THREE.Vector3(P_RADIUS*2, P_HEIGHT, P_RADIUS*2);
var keys = {}, moveX = 0, moveZ = 0, locked = false, countdown = 5, gameStarted = false;
var playerHP = 100, playerArmor = 100, sbTimer = 0, sbActive = false, projectiles = [], enemies = [], hitMarkerTimer = 0, roundNum = 1, clearTimer = -1;
var sliding=false,slideTimer=0,slideCD=0,slidePromptTimer=0,slideSpeed=14,slideKeyWas=false,slowTimer=0;
var scene = new THREE.Scene();
// Sky gradient
var skyCanvas=document.createElement('canvas');skyCanvas.width=2;skyCanvas.height=512;
var sctx=skyCanvas.getContext('2d');
var sgrd=sctx.createLinearGradient(0,0,0,512);
sgrd.addColorStop(0,'#1a1a3e');sgrd.addColorStop(0.2,'#2a4a6a');sgrd.addColorStop(0.4,'#3a6a9a');
sgrd.addColorStop(0.6,'#5a8aba');sgrd.addColorStop(0.8,'#8abadd');sgrd.addColorStop(1,'#aaccee');
sctx.fillStyle=sgrd;sctx.fillRect(0,0,2,512);
scene.background=new THREE.CanvasTexture(skyCanvas);
scene.fog=new THREE.Fog(0x8899aa,25,50);
// Clouds
function addCloud(x,z){
  var g=new THREE.Group();
  for(var ci=0;ci<6;ci++){
    var cr=0.4+Math.random()*0.6,ch=0.15+Math.random()*0.2;
    var c=new THREE.Mesh(new THREE.SphereGeometry(cr,6,6),new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,metalness:0,transparent:true,opacity:0.25+Math.random()*0.2}));
    c.position.set((Math.random()-0.5)*1.5,(Math.random()-0.5)*0.3,(Math.random()-0.5)*1.5);
    c.scale.y=ch/cr;g.add(c);
  }
  g.position.set(x,3.2+Math.random()*0.5,z);scene.add(g);
}
addCloud(-8,-8);addCloud(8,-7);addCloud(-6,9);addCloud(10,6);addCloud(0,-12);addCloud(-12,0);addCloud(12,2);
// Menu particles
for(var pi=0;pi<60;pi++){
  var pd=document.createElement('div');pd.className='menu-particle';
  var sz=1+Math.random()*3;pd.style.width=sz+'px';pd.style.height=sz+'px';
  pd.style.left=Math.random()*100+'%';pd.style.bottom='-5%';
  var colors=['rgba(255,68,170,','rgba(68,170,255,','rgba(68,255,170,','rgba(170,68,255,','rgba(255,136,68,'];pd.style.background=colors[Math.floor(Math.random()*colors.length)]+(0.1+Math.random()*0.3)+')';
  var dur=8+Math.random()*12;pd.style.animationDuration=dur+'s';
  pd.style.animationDelay=Math.random()*dur+'s';
  document.body.appendChild(pd);
}
var cam = new THREE.PerspectiveCamera(80, window.innerWidth/window.innerHeight, 0.1, 100);
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(window.devicePixelRatio);
document.body.prepend(renderer.domElement);
var amb = new THREE.AmbientLight(0x556070, 0.6);
scene.add(amb);
var dir = new THREE.DirectionalLight(0xffeedd, 1.2);
dir.position.set(15, 20, 10);
dir.castShadow = true;
dir.shadow.mapSize.width = 1024;
dir.shadow.mapSize.height = 1024;
scene.add(dir);
var hem = new THREE.HemisphereLight(0x88bbff, 0x445566, 0.5);
scene.add(hem);
var mapBoxes = [];
function addBox(p,s,c,shadows){
  if(shadows===undefined)shadows=true;
  var g=new THREE.BoxGeometry(s.x,s.y,s.z);
  var m=new THREE.MeshStandardMaterial({color:c,roughness:0.7});
  var mesh=new THREE.Mesh(g,m);
  mesh.position.copy(p);mesh.castShadow=shadows;mesh.receiveShadow=true;
  scene.add(mesh);
  mapBoxes.push({pos:p.clone(),size:s.clone(),mesh:mesh});
}
addBox(new THREE.Vector3(0,-0.1,0),new THREE.Vector3(30,0.2,30),0x333333);
var bw=1.0,bh=4,bc=0x4a4a55;
addBox(new THREE.Vector3(0,bh/2,-15),new THREE.Vector3(30,bh,bw),bc);
addBox(new THREE.Vector3(0,bh/2,15),new THREE.Vector3(30,bh,bw),bc);
addBox(new THREE.Vector3(-15,bh/2,0),new THREE.Vector3(bw,bh,30),bc);
addBox(new THREE.Vector3(15,bh/2,0),new THREE.Vector3(bw,bh,30),bc);
// Thickened corners
var cc=0x556677;addBox(new THREE.Vector3(15,bh/2,-15),new THREE.Vector3(1.5,bh,1.5),cc);
addBox(new THREE.Vector3(15,bh/2,15),new THREE.Vector3(1.5,bh,1.5),cc);
addBox(new THREE.Vector3(-15,bh/2,-15),new THREE.Vector3(1.5,bh,1.5),cc);
addBox(new THREE.Vector3(-15,bh/2,15),new THREE.Vector3(1.5,bh,1.5),cc);
addBox(new THREE.Vector3(0,0.75,0),new THREE.Vector3(5,1.5,5),0x8899aa);
addBox(new THREE.Vector3(0,1.55,0),new THREE.Vector3(3.5,0.8,3.5),0x9999aa);
addBox(new THREE.Vector3(0,2.15,0),new THREE.Vector3(2,0.5,2),0x6688aa);

var playerLoadout=['ak47',null,null,null],currentSlot=0,selectedArmorySlot=0;
function switchToSlot(slot){
  if(slot<0||slot>3)return;
  var type=playerLoadout[slot];
  if(!type)return;
  currentSlot=slot;
  if(gunGroup){cam.remove(gunGroup);}
  currentGun=type;
  gunGroup=createGunModel(type);
  gunGroup.position.set(0.2,-0.15,-0.35);
  gunGroup.scale.set(1.5,1.5,1.5);
  cam.add(gunGroup);
  shootCD=0;isADS=false;isReloading=false;reloadTimer=0;cam.fov=80;cam.updateProjectionMatrix();
  document.getElementById('scope-overlay').style.display='none';
  // Update menu slot display
  document.querySelectorAll('.loadout-slot').forEach(function(s,i){
    s.querySelector('.slot-gun').textContent=playerLoadout[i]?gunData[playerLoadout[i]].name : '─';
  });
}
function updateArmoryUI(){
  for(var si=0;si<4;si++){
    var el=document.querySelector('.a-slot[data-slot="'+si+'"]');
    el.querySelector('.a-slot-gun').textContent=playerLoadout[si]?gunData[playerLoadout[si]].name : '─';
    el.classList.toggle('active',si===selectedArmorySlot);
  }
}

function resolveCollisions(){

    }
    // Walk anim
    if(e.walkTime>0.3){for(var li=0;li<e.mesh.children.length;li++){var c=e.mesh.children[li];if(c.geometry&&c.geometry.type==='CylinderGeometry'&&c.position.y<0.1){c.position.x+=Math.sin(e.walkTime*20)*0.025*spd}}}
    // HP/armor bars
    if(e.hBar){e.hBar.position.set(e.pos.x,0.7,e.pos.z);e.hBar.scale.x=Math.max(0,e.hp/e.maxHp);e.hBar.position.x=e.pos.x-(1-Math.max(0,e.hp/e.maxHp))*0.3}
    if(e.aBar){e.aBar.position.set(e.pos.x,0.63,e.pos.z);e.aBar.scale.x=Math.max(0,e.armor/e.maxArmor);e.aBar.position.x=e.pos.x-(1-Math.max(0,e.armor/e.maxArmor))*0.3}
  }
}
function showDmgNum(p3d,dmg,clr){
  var v=p3d.clone();v.project(cam);
  var x=(v.x*0.5+0.5)*window.innerWidth,y=(-v.y*0.5+0.5)*window.innerHeight;
  var el=document.createElement('div');
  el.textContent='-'+dmg;
  el.style.cssText='position:fixed;left:'+x+'px;top:'+y+'px;pointer-events:none;z-index:7;font-size:22px;font-weight:bold;color:'+clr+';font-family:Arial;text-shadow:0 0 6px #000;opacity:1;transition:all 0.7s ease-out';
  document.body.appendChild(el);
  requestAnimationFrame(function(){el.style.transform='translateY(-35px)';el.style.opacity='0';});
  setTimeout(function(){el.remove();},750);
}
var lastTime=0;
function animate(time){
  var dt=Math.min((time-lastTime)/1000,0.05);lastTime=time;
  moveX=0;moveZ=0;
  if(keys['KeyA']||keys['ArrowLeft'])moveX-=1;
  if(keys['KeyD']||keys['ArrowRight'])moveX+=1;
if(keys['KeyW']||keys['ArrowUp'])moveZ+=1;
if(keys['KeyS']||keys['ArrowDown'])moveZ-=1;
  if(locked&&!gameStarted){countdown-=dt;sl.position.set(pos.x,5,pos.z);sl.target.position.copy(pos);if(countdown<=0){gameStarted=true;countdown=0;onGround=true;scene.remove(sl);scene.remove(sl.target);}}
  if(locked&&gameStarted)updatePhysics(dt);
  cam.position.set(pos.x,pos.y+EYE_H-(sliding?0.35:0),pos.z);
  cam.rotation.order='YXZ';cam.rotation.set(pitch,yaw,0);
  var gDir2=new THREE.Vector3(0,0,-1);gDir2.applyQuaternion(cam.quaternion);
  var rc2=new THREE.Raycaster(cam.position,gDir2);
  var meshes2=[];for(var i=0;i<mapBoxes.length;i++)meshes2.push(mapBoxes[i].mesh);
  var h2=rc2.intersectObjects(meshes2);var sg=true;
  for(var i=0;i<h2.length;i++){if(h2[i].distance<0.6){sg=false;break;}}
  if(gunGroup)gunGroup.visible=sg;
  // Gameplay update gate (pause when ESC is pressed)
  if(locked&&gameStarted){
    if(slowTimer>0)slowTimer-=dt;
    // Reload timer
    if(isReloading){reloadTimer-=dt;if(reloadTimer<=0){isReloading=false;reloadTimer=0;gunAmmo[currentGun]=gunData[currentGun].mag;}}
    // Auto-fire + shoot cooldown
    if(shootCD>0)shootCD-=dt;
    if(autoFire&&shootCD<=0&&!isReloading)shoot();
    // Smooth ADS FOV
    var fov=isADS?gunData[currentGun].adsFov:80;
    cam.fov+=(fov-cam.fov)*Math.min(1,dt*10);
    cam.updateProjectionMatrix();
    // Scope overlay
    var so=document.getElementById('scope-overlay');
    if(isADS&&currentGun!=='grapple'){
      so.style.display='block';
      var sr=document.getElementById('scope-ring');
      if(currentGun==='awp'){sr.style.width='120px';sr.style.height='120px';sr.style.borderColor='rgba(0,0,0,.95)';sr.style.borderWidth='3px';}
      else{sr.style.width='60px';sr.style.height='60px';sr.style.borderColor='rgba(0,0,0,.3)';sr.style.borderWidth='1px';}
    }else{so.style.display='none';}
    // ADS gun position
    if(gunGroup){
      if(currentGun==='awp'){var tPos=isADS?new THREE.Vector3(0,-0.07,-0.2):new THREE.Vector3(0.2,-0.15,-0.35);gunGroup.position.lerp(tPos,Math.min(1,dt*12));}
      else if(currentGun==='grapple'){
        var tPos=isADS?new THREE.Vector3(0.18,-0.08,-0.28):new THREE.Vector3(0.2,-0.15,-0.35);
        gunGroup.position.lerp(tPos,Math.min(1,dt*10));
      }else{
        var tPos=isADS?new THREE.Vector3(0.15,-0.08,-0.28):new THREE.Vector3(0.2,-0.15,-0.35);
        gunGroup.position.lerp(tPos,Math.min(1,dt*10));
      }
    }
    for(var i=impacts.length-1;i>=0;i--){impacts[i].time+=dt;if(impacts[i].time>2){scene.remove(impacts[i].mesh);impacts.splice(i,1);}}
    // Shield break timer
    if(sbActive){sbTimer+=dt;if(sbTimer>1.2){sbActive=false;document.getElementById('sb').style.display='none';}}
    // Enemies
    updateEnemies(dt);
    // Round clear
    var alive=0;for(var ei=0;ei<enemies.length;ei++){if(enemies[ei].hp>0)alive++}
    if(alive===0&&enemies.length>0&&clearTimer<0&&gameStarted)clearTimer=0;
    if(alive===0&&enemies.length>0&&clearTimer>=0&&gameStarted){
      clearTimer+=dt;
      if(clearTimer<0.1){playerHP=100;playerArmor=100;document.getElementById('round-clear').style.display='block';document.getElementById('round-clear').textContent='第 '+roundNum+' 回合 通關';document.getElementById('round-num').style.display='block';document.getElementById('round-num').textContent='+'+(Math.floor(clearTimer*10))+' 分'}
      if(clearTimer>3){
        clearTimer=-1;
        roundNum++;
        for(var ei=0;ei<enemies.length;ei++){
          var e=enemies[ei];
          e.hp=e.maxHp*(1+roundNum*0.2);e.armor=e.maxArmor*(1+roundNum*0.15);
          e.mesh.visible=true;
          var spawnPos=e.pos.clone();
          spawnPos.x=-12+24*Math.random();spawnPos.z=-12+24*Math.random();
          spawnPos.x=Math.max(-13,Math.min(13,spawnPos.x));spawnPos.z=Math.max(-13,Math.min(13,spawnPos.z));
          e.pos.copy(spawnPos);e.mesh.position.copy(spawnPos);
          if(e.hBar)e.hBar.visible=true;if(e.aBar)e.aBar.visible=true;
        }
        document.getElementById('round-clear').style.display='none';
        document.getElementById('round-num').style.display='none';
      }
    }
    // Grapple shot visual
    if(grappleShot){
      grappleShot.progress+=dt*12;
      var gp=Math.min(grappleShot.progress,1);
      grappleShot.mesh.position.lerpVectors(grappleShot.start,grappleShot.end,gp);
      if(grappleLine){
        var ls=cam.position.clone();var le=grappleShot.mesh.position.clone();
        grappleLine.geometry.dispose();
        grappleLine.geometry=new THREE.BufferGeometry().setFromPoints([ls,le]);
      }
      if(gp>=1){scene.remove(grappleShot.mesh);grappleShot=null;}
    }
    // Grapple update
    if(grappleActive)updateGrapple(dt);
    // Sky Platform timer
    if(skyPlat&&platActive){
      var onPlat=Math.abs(pos.x)<2.8&&Math.abs(pos.z)<2.8&&pos.y>10.2&&pos.y<11.4&&onGround;
      if(onPlat){platTimer+=dt;if(platTimer>=10){
        platActive=false;platTimer=0;
        skyPlat.mesh.visible=false;skyPlat.border.visible=false;skyPlat.glow.visible=false;
        skyPlat.pos.y=-50;skyPlat.mesh.position.y=-50;
        skyPlat.border.position.y=-50;skyPlat.glow.position.y=-50;
        platRespawnTimer=5;
      }}else if(platTimer>0&&!onPlat){platTimer-=dt*0.3;if(platTimer<0)platTimer=0;}
      var pct=platTimer/10;
      var r=Math.min(1,pct*2),g=Math.min(1,2-pct*2),b=1-pct*0.5;
      if(skyPlat.mesh.material.emissive){skyPlat.mesh.material.emissive.setRGB(r*0.5,g*0.5,b);skyPlat.mesh.material.emissiveIntensity=0.2+0.3*Math.sin(time*3);}
      skyPlat.border.material.color.setRGB(r,g,b);
      skyPlat.glow.material.color.setRGB(r,g,b);
      skyPlat.glow.material.opacity=0.08+0.1*Math.sin(time*2);
    }
    if(!platActive&&platRespawnTimer>0){
      platRespawnTimer-=dt;
      if(platRespawnTimer<=0){
        platActive=true;platTimer=0;platRespawnTimer=0;
        skyPlat.mesh.visible=true;skyPlat.border.visible=true;skyPlat.glow.visible=true;
        skyPlat.pos.y=10;skyPlat.mesh.position.y=10;
        skyPlat.border.position.y=10;skyPlat.glow.position.y=10;
      }
    }
    // Projectiles
    for(var pi=projectiles.length-1;pi>=0;pi--){
      var pj=projectiles[pi];
      pj.pos.add(pj.vel.clone().multiplyScalar(dt));pj.mesh.position.copy(pj.pos);pj.life-=dt;
      if(pj.life<=0){scene.remove(pj.mesh);projectiles.splice(pi,1);continue;}
      if(pj.pos.distanceTo(pos)<P_RADIUS+0.15){playerDamage(12);slowTimer=0.5;showDmgNum(pos.clone(),12,'#ff4444');scene.remove(pj.mesh);projectiles.splice(pi,1);continue;}
      for(var bi=0;bi<mapBoxes.length;bi++){
        var b=mapBoxes[bi];
        if(Math.abs(pj.pos.x-b.pos.x)<b.size.x/2+0.05&&Math.abs(pj.pos.y-b.pos.y)<b.size.y/2+0.05&&Math.abs(pj.pos.z-b.pos.z)<b.size.z/2+0.05){
          scene.remove(pj.mesh);projectiles.splice(pi,1);break;
        }
      }
    }
  }
  // HUD
  document.getElementById('hp-fill').style.width=playerHP+'%';
  document.getElementById('hp-txt').textContent=Math.ceil(playerHP);
  document.getElementById('armor-fill').style.width=playerArmor+'%';
  document.getElementById('armor-txt').textContent=Math.ceil(playerArmor);
  // Ammo HUD
  var ammoEl=document.getElementById('ammo-hud');
  if(currentGun==='grapple'){ammoEl.innerHTML='<span style="font-size:20px;color:#4af;letter-spacing:2px">∞ 勾爪</span>';}
  else if(isReloading){ammoEl.innerHTML='<span style="color:#ff8;font-size:18px;letter-spacing:2px">RELOADING...</span>';}
  else{ammoEl.innerHTML='<span id="ammo-txt" style="color:'+(gunAmmo[currentGun]===0?'#f44':'#fff')+'">'+gunAmmo[currentGun]+'</span><span id="ammo-sep"> / </span><span id="ammo-max">'+gunData[currentGun].mag+'</span>';}
  // Slot HUD
  var sh=document.getElementById('slot-hud');sh.innerHTML='';
  for(var si=0;si<4;si++){
    var sd=document.createElement('div');sd.className='sh-slot'+(si===currentSlot?' active':'');
    sd.textContent=(si+1)+' '+(playerLoadout[si]?gunData[playerLoadout[si]].name : '-');sh.appendChild(sd);
  }
  // Platform HUD
  var ph=document.getElementById('plat-hud');
  var op=skyPlat&&Math.abs(pos.x)<2.8&&Math.abs(pos.z)<2.8&&pos.y>10.2&&pos.y<11.4&&onGround;
  if(!platActive&&platRespawnTimer>0){ph.style.display='block';ph.textContent='平台重生 '+Math.ceil(platRespawnTimer)+' 秒';ph.style.color='#4af';}
  else if(op&&platTimer>0){ph.style.display='block';var remain=Math.max(0,10-platTimer);ph.textContent='平台倒數 '+Math.ceil(remain)+' 秒';ph.style.color=remain<3?'#f44':'#4af';}
  else{ph.style.display=op?'block':'none';if(op){ph.textContent='平台 10 秒';ph.style.color='#4af';}}
  if(hitMarkerTimer>0)hitMarkerTimer-=dt;
  var el=document.getElementById('crosshair');
  if(isADS&&locked&&gameStarted){el.style.display='none';}
  else{el.style.display='block';}
  if(locked&&!gameStarted){el.textContent=Math.ceil(countdown);el.style.display='block';}
  else if(hitMarkerTimer>0){el.textContent='✕';el.style.color='#ff4444';}
  else{el.style.color='rgba(255,255,255,0.8)';el.textContent=wallClinging?'\u25A3':'+';}
  renderer.render(scene,cam);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
}
</script>

var s=document.createElement('script');
s.src='https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js';
s.onload=bootGame;
s.onerror=function(){
  var s2=document.createElement('script');
  s2.src='https://unpkg.com/three@0.152.0/build/three.min.js';
  s2.onload=bootGame;
  s2.onerror=function(){
    document.getElementById('error').style.display='block';
    document.getElementById('start-msg').style.display='none';
  };
  document.head.appendChild(s2);
};
document.head.appendChild(s);
"></script>
