<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記憶翻牌 — 派對小遊戲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#1a1a2e;font-family:'Segoe UI','Microsoft YaHei',sans-serif;user-select:none;display:flex;align-items:center;justify-content:center;height:100vh}
canvas{display:block}

#start-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;cursor:pointer}
#start-screen h1{font-size:3em;color:#fd0;letter-spacing:8px;margin-bottom:4px;text-shadow:0 0 40px rgba(255,200,0,.3)}
#start-screen .sub{color:rgba(255,255,255,.4);font-size:1em;letter-spacing:3px;margin-bottom:10px}
#start-screen .limit{color:rgba(255,200,100,.3);font-size:.9em;letter-spacing:2px;margin-bottom:14px}
#start-screen .controls{margin-top:16px;display:flex;gap:30px;color:rgba(255,255,255,.3);font-size:.8em;letter-spacing:1px}
#start-screen .hint{color:rgba(255,255,255,.2);font-size:.85em;letter-spacing:2px}

#result{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:30}
#result-box{background:linear-gradient(135deg,#1a1a2a,#0a0a1a);border:1px solid rgba(255,200,68,.2);border-radius:14px;padding:30px 50px;text-align:center;max-width:380px;width:90%}
#result-box h2{font-size:32px;color:#fd0;letter-spacing:4px;margin-bottom:6px;text-shadow:0 0 20px rgba(255,200,0,.2)}
#result-box .final-pairs{font-size:64px;font-weight:bold;color:#fff;margin:10px 0}
#result-box .final-pairs span{color:#fd0}
#result-box .stats{color:rgba(255,255,255,.4);font-size:14px;letter-spacing:1px;margin-top:8px}
#result-box .btn-restart{pointer-events:auto;display:inline-block;margin-top:20px;padding:10px 28px;background:rgba(255,200,0,.15);border:1px solid rgba(255,200,0,.3);border-radius:8px;color:#fd0;font-size:16px;cursor:pointer;letter-spacing:2px;transition:all .2s}
#result-box .btn-restart:hover{background:rgba(255,200,0,.25);border-color:rgba(255,200,0,.5)}
</style>
</head>
<body>

<div id="start-screen">
  <h1>🧠 記憶翻牌</h1>
  <div class="sub">記住數字位置，找出配對的兩張牌</div>
  <div class="limit">⚠ 只能翻 15 次</div>
  <div class="controls">
    <span>🖱 點擊翻牌</span>
    <span>📌 5 秒記憶</span>
  </div>
  <div class="hint">點擊開始</div>
</div>

<div id="result">
  <div id="result-box">
    <h2 id="result-title">🎉 完成！</h2>
    <div class="final-pairs">✅ <span id="final-matched">0</span> / 4</div>
    <div class="stats">翻牌次數：<span id="final-flips">0</span> / 15</div>
    <div class="stats">錯誤次數：<span id="final-mistakes">0</span></div>
    <div class="btn-restart" onclick="location.reload()">🔄 再玩一次</div>
  </div>
</div>

<script>
var W = 800, H = 600;
var canvas = document.createElement('canvas');
canvas.width = W; canvas.height = H;
document.body.prepend(canvas);
var ctx = canvas.getContext('2d');
canvas.style.maxWidth = '100vw';
canvas.style.maxHeight = '100vh';

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(r===undefined)r=0;
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);this.closePath();
    return this;
  };
}

// ========== GAME STATE ==========
var values = [1,1,2,2,3,3,4,4];
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
shuffle(values);

var cW=80,cH=100,gap=20,cols=4,rows=2;
var sX=(W-cols*(cW+gap)-gap)/2,sY=(H-rows*(cH+gap)-gap)/2+30;

// Pre-compute positions
var positions=[];
for(var i=0;i<8;i++){
  var col=i%cols,row=Math.floor(i/cols);
  positions.push({x:sX+col*(cW+gap),y:sY+row*(cH+gap)});
}

var cards=[];
for(var i=0;i<8;i++){
  cards.push({value:values[i],x:positions[i].x,y:positions[i].y,w:cW,h:cH,faceUp:true,matched:false});
}

var matched=0, mistakes=0, targetNum=0, running=false, ended=false, canClick=false;
var memorizeTimer=5, memorizePhase=true;
var foundThisRound=0, totalFlips=0, maxFlips=15;

function pickTarget(){
  var seen={},uniq=[];
  for(var i=0;i<cards.length;i++)if(!cards[i].matched&&!seen[cards[i].value]){seen[cards[i].value]=true;uniq.push(cards[i].value);}
  if(uniq.length===0)return;
  targetNum=uniq[Math.floor(Math.random()*uniq.length)];
  foundThisRound=0;
}

// ========== DRAW ==========
function draw(){
  ctx.clearRect(0,0,W,H);
  // Sky
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a1a3e');g.addColorStop(1,'#2a2a4e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // House body
  ctx.fillStyle='#4a4a6a';ctx.strokeStyle='#333355';ctx.lineWidth=2;
  ctx.fillRect(100,200,600,350);ctx.strokeRect(100,200,600,350);
  // Roof
  ctx.beginPath();ctx.moveTo(50,200);ctx.lineTo(400,100);ctx.lineTo(750,200);ctx.closePath();
  ctx.fillStyle='#663333';ctx.strokeStyle='#442222';ctx.fill();ctx.stroke();
  // Windows
  ctx.fillStyle='#6688aa';ctx.strokeStyle='#555577';
  ctx.fillRect(160,250,100,80);ctx.strokeRect(160,250,100,80);
  ctx.fillRect(540,250,100,80);ctx.strokeRect(540,250,100,80);
  ctx.beginPath();ctx.moveTo(210,250);ctx.lineTo(210,330);ctx.stroke();
  ctx.moveTo(160,290);ctx.lineTo(260,290);ctx.stroke();
  ctx.moveTo(590,250);ctx.lineTo(590,330);ctx.stroke();
  ctx.moveTo(540,290);ctx.lineTo(640,290);ctx.stroke();
  // Door
  ctx.fillStyle='#554433';ctx.strokeStyle='#443322';
  ctx.fillRect(365,400,70,150);ctx.strokeRect(365,400,70,150);
  ctx.beginPath();ctx.arc(370,475,4,0,Math.PI*2);ctx.fillStyle='#ffcc44';ctx.fill();
  // Chimney
  ctx.fillStyle='#555577';ctx.fillRect(550,110,50,90);ctx.strokeRect(550,110,50,90);
  // Ground
  ctx.fillStyle='#2a3a2a';ctx.fillRect(0,540,W,60);

  // Top text
  ctx.textAlign='center';ctx.textBaseline='top';
  if(memorizePhase){
    ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='bold 24px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.shadowColor='rgba(255,255,255,.3)';ctx.shadowBlur=15;
    ctx.fillText('\u23F3 \u8A18\u4F4F\u724C\u7684\u4F4D\u7F6E\uFF01',W/2,20);
    ctx.font='bold 48px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillStyle='#fd0';ctx.shadowColor='rgba(255,200,0,.4)';ctx.shadowBlur=25;
    ctx.fillText(Math.ceil(memorizeTimer),W/2,55);
    ctx.shadowBlur=0;
  } else {
    ctx.fillStyle='#fd0';ctx.font='bold 36px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.shadowColor='rgba(255,200,0,.3)';ctx.shadowBlur=20;
    ctx.fillText('\u627E\u51FA  '+targetNum,W/2,20);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='18px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.textAlign='left';ctx.fillText('\u2705 '+matched+' / 4',30,555);
    ctx.textAlign='right';ctx.fillText('\u274C '+mistakes+'  \u2191 '+totalFlips+'/'+maxFlips,W-30,555);
  }

  // Cards
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    if(c.matched)continue;
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.roundRect(c.x-2,c.y-2,c.w+4,c.h+4,8);ctx.fill();
    if(c.faceUp){
      ctx.fillStyle='#f5f0e0';ctx.beginPath();ctx.roundRect(c.x,c.y,c.w,c.h,8);ctx.fill();
      ctx.strokeStyle='#ccaa44';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(c.x,c.y,c.w,c.h,8);ctx.stroke();
      ctx.fillStyle='#333';ctx.font='bold 36px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(c.value,c.x+c.w/2,c.y+c.h/2);
    } else {
      var grad=ctx.createLinearGradient(c.x,c.y,c.x+c.w,c.y);
      grad.addColorStop(0,'#4444aa');grad.addColorStop(0.5,'#5555cc');grad.addColorStop(1,'#4444aa');
      ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(c.x,c.y,c.w,c.h,8);ctx.fill();
      ctx.strokeStyle='#6666dd';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(c.x,c.y,c.w,c.h,8);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.15)';ctx.font='28px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('?',c.x+c.w/2,c.y+c.h/2);
    }
  }
}

// ========== FLIP LOGIC ==========
function flipCard(idx){
  if(!canClick||!running||ended||memorizePhase)return;
  var c=cards[idx];
  if(c.matched||c.faceUp)return;
  totalFlips++;

  // Check flip limit
  if(totalFlips>maxFlips){
    canClick=false;
    setTimeout(function(){endGame(false);},200);
    return;
  }

  c.faceUp=true;
  canClick=false;

  if(c.value===targetNum){
    foundThisRound++;
    if(foundThisRound>=2){
      setTimeout(function(){
        for(var i=0;i<cards.length;i++){if(!cards[i].matched&&cards[i].value===targetNum)cards[i].matched=true;}
        matched++;
        if(matched>=4){endGame(true);return;}
        pickTarget();canClick=true;draw();
      },400);
    } else {
      setTimeout(function(){canClick=true;draw();},200);
    }
  } else {
    mistakes++;
    setTimeout(function(){c.faceUp=false;canClick=true;draw();},600);
  }
  draw();
}

function endGame(won){
  ended=true;running=false;
  document.getElementById('final-matched').textContent=matched;
  document.getElementById('final-flips').textContent=totalFlips<=maxFlips?totalFlips:maxFlips;
  document.getElementById('final-mistakes').textContent=mistakes;
  document.getElementById('result-title').textContent=won?'🎉 完成！':'💀 次數用盡...';
  document.getElementById('result').style.display='flex';
}

// ========== EVENTS ==========
canvas.addEventListener('click',function(e){
  var rect=canvas.getBoundingClientRect();
  var mx=(e.clientX-rect.left)*(W/rect.width);
  var my=(e.clientY-rect.top)*(H/rect.height);
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    if(mx>=c.x&&mx<=c.x+c.w&&my>=c.y&&my<=c.y+c.h){flipCard(i);break;}
  }
});
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});

// Start
document.getElementById('start-screen').addEventListener('click',function(){
  this.style.display='none';
  running=true;
  memorizePhase=true;
  memorizeTimer=5;
  totalFlips=0;
  for(var i=0;i<cards.length;i++){cards[i].faceUp=true;cards[i].matched=false;}
  draw();
});

// ========== GAME LOOP ==========
var lastTime=performance.now();

function gameLoop(t){
  requestAnimationFrame(gameLoop);
  var dt=Math.min((t-lastTime)/1000,0.05);
  lastTime=t;

  if(memorizePhase&&running){
    memorizeTimer-=dt;
    if(memorizeTimer<=0){
      memorizePhase=false;
      for(var i=0;i<cards.length;i++)cards[i].faceUp=false;
      pickTarget();
      canClick=true;
    }
    draw();
  }
}
gameLoop(performance.now());

draw();
</script>
</body>
</html>
