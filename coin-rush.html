<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金幣小學 — 派對小遊戲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI','Microsoft YaHei',sans-serif;user-select:none}
canvas{display:block}

#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#score{position:absolute;top:20px;left:20px;color:#fff;font-size:28px;font-weight:bold;letter-spacing:2px;text-shadow:0 0 20px rgba(0,0,0,.8)}
#score span{color:#fd0}
#timer{position:absolute;top:20px;right:20px;color:#fff;font-size:28px;font-weight:bold;letter-spacing:2px;text-shadow:0 0 20px rgba(0,0,0,.8)}
#timer.warning{color:#f44}
#coin-count{position:absolute;top:70px;left:20px;color:rgba(255,255,255,.5);font-size:16px;letter-spacing:1px;text-shadow:0 0 10px rgba(0,0,0,.8)}
#coin-count span{color:#fd0}
#hint{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.2);font-size:14px;letter-spacing:2px;text-shadow:0 0 10px rgba(0,0,0,.8)}

#start-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;cursor:pointer}
#start-screen h1{font-size:3em;color:#fd0;letter-spacing:8px;margin-bottom:4px;text-shadow:0 0 40px rgba(255,200,0,.3)}
#start-screen .sub{color:rgba(255,255,255,.4);font-size:1em;letter-spacing:3px;margin-bottom:24px}
#start-screen .hint{color:rgba(255,255,255,.2);font-size:.85em;letter-spacing:2px}
#start-screen .controls{margin-top:20px;display:flex;gap:30px;color:rgba(255,255,255,.3);font-size:.8em;letter-spacing:1px}
#start-screen .controls span{display:flex;align-items:center;gap:6px}

#result{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:30}
#result-box{background:linear-gradient(135deg,#1a1a2a,#0a0a1a);border:1px solid rgba(255,200,68,.2);border-radius:14px;padding:30px 50px;text-align:center;max-width:380px;width:90%}
#result-box h2{font-size:32px;color:#fd0;letter-spacing:4px;margin-bottom:6px;text-shadow:0 0 20px rgba(255,200,0,.2)}
#result-box .final-score{font-size:64px;font-weight:bold;color:#fff;margin:10px 0;text-shadow:0 0 30px rgba(255,200,0,.15)}
#result-box .final-score span{color:#fd0}
#result-box .stats{color:rgba(255,255,255,.4);font-size:14px;letter-spacing:1px;margin-top:8px}
#result-box .btn-restart{pointer-events:auto;display:inline-block;margin-top:20px;padding:10px 28px;background:rgba(255,200,0,.15);border:1px solid rgba(255,200,0,.3);border-radius:8px;color:#fd0;font-size:16px;cursor:pointer;letter-spacing:2px;transition:all .2s}
#result-box .btn-restart:hover{background:rgba(255,200,0,.25);border-color:rgba(255,200,0,.5)}
</style>
</head>
<body>

<div id="start-screen">
  <h1>🏫 金幣小學</h1>
  <div class="sub">在時間內蒐集最多的金幣</div>
  <div class="controls">
    <span>🖱 WASD 移動</span>
    <span>␣ 跳躍</span>
    <span>🖱 滑鼠視角</span>
  </div>
  <div class="hint">點擊開始</div>
</div>

<div id="ui">
  <div id="score">🪙 <span id="score-val">0</span></div>
  <div id="coin-count">場上金幣 <span id="coin-total">0</span></div>
  <div id="timer">60</div>
  <div id="hint">WASD 移動 · 空白鍵跳躍 · 靠近金幣自動拾取</div>
</div>

<div id="result">
  <div id="result-box">
    <h2>⏱ 時間到！</h2>
    <div class="final-score"><span id="final-score">0</span></div>
    <div class="stats">共拾取 <span id="final-coins">0</span> 枚金幣</div>
    <div class="btn-restart" onclick="location.reload()">🔄 再玩一次</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var scene=new THREE.Scene(); scene.background=new THREE.Color(0x1a1a2e); scene.fog=new THREE.Fog(0x1a1a2e,20,40);
var camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,50);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
document.body.prepend(renderer.domElement);
window.addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// Material helper
function M(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.6,metalness:0.1},o||{}));}

// Lights
var amb=new THREE.AmbientLight(0x404060,0.5); scene.add(amb);
var dir=new THREE.DirectionalLight(0xffeedd,1.2); dir.position.set(10,20,10); dir.castShadow=true; dir.shadow.mapSize.width=1024;dir.shadow.mapSize.height=1024;dir.shadow.camera.near=0.5;dir.shadow.camera.far=50;dir.shadow.camera.left=-20;dir.shadow.camera.right=20;dir.shadow.camera.top=20;dir.shadow.camera.bottom=-20;scene.add(dir);
var hem=new THREE.HemisphereLight(0x8888ff,0x44aa44,0.4); scene.add(hem);

// ========== MAP ==========
// Ground
var ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),M(0x2a2a3e,{roughness:1,metalness:0}));
ground.rotation.x=-Math.PI/2; ground.position.set(0,-0.1,0); ground.receiveShadow=true; scene.add(ground);

// Collidable objects: {x,z,y,w,d,h,type}
var colliders=[];

// School building
var buildMat=M(0x445577,{roughness:0.4,metalness:0.2});
var build=new THREE.Mesh(new THREE.BoxGeometry(8,3,6),buildMat);
build.position.set(0,1.5,-4); build.castShadow=true; build.receiveShadow=true; scene.add(build);
colliders.push({x:0,z:-4,y:1.5,w:8,d:6,h:3});
var roof=new THREE.Mesh(new THREE.BoxGeometry(8.2,0.2,6.2),M(0x667799,{roughness:0.3,metalness:0.4}));
roof.position.set(0,3.1,-4); scene.add(roof);
for(var wi=0;wi<4;wi++){
  var wMesh=new THREE.Mesh(new THREE.PlaneGeometry(0.8,1.2),new THREE.MeshStandardMaterial({color:0x88bbff,emissive:0x88bbff,emissiveIntensity:0.15,side:THREE.DoubleSide,transparent:true,opacity:0.7}));
  wMesh.position.set(-2.8+wi*1.8,1.5,-7.01); scene.add(wMesh);
}
var door=new THREE.Mesh(new THREE.PlaneGeometry(1.2,2),M(0x554433,{roughness:0.8}));
door.position.set(0,1,-7.01); scene.add(door);

// Platforms (school furniture / playground structures)
function makePlat(x,z,y,w,d,col){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,0.25,d),M(col,{roughness:0.5,metalness:0.2,emissive:col,emissiveIntensity:0.05}));
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; scene.add(m);
  return {x:x,z:z,y:y,w:w,d:d};
}
var plats=[
  makePlat(-5,-2,1.2,2.5,2.5,0x44aaff),
  makePlat(5,-2,1.5,2.5,2.5,0xff6644),
  makePlat(-5,3,1.8,2.5,2.5,0x66dd44),
  makePlat(5,3,2.0,2.5,2.5,0xff44aa),
  makePlat(-8,-6,3.0,2.0,2.0,0x44ddff),
  makePlat(8,-6,3.5,2.0,2.0,0xff8844),
  makePlat(-8,7,2.8,2.0,2.0,0x44ff88),
  makePlat(8,7,3.2,2.0,2.0,0xaa44ff),
  makePlat(0,-8,4.0,2.5,2.5,0xffee44),
  makePlat(0,9,4.5,2.5,2.5,0x44ffee),
  makePlat(-3,0,0.5,2.0,2.0,0xcc88ff),
  makePlat(3,0,0.7,2.0,2.0,0xff88cc),
];
// Schoolyard trees
function makeTree(x,z){
  var trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.15,1,6),M(0x554433,{roughness:0.9}));
  trunk.position.set(x,0.5,z); scene.add(trunk);
  var crown=new THREE.Mesh(new THREE.SphereGeometry(0.8,6,6),M(0x338833,{roughness:0.8}));
  crown.position.set(x,1.4,z); scene.add(crown);
}
makeTree(-9,-7); makeTree(9,-7); makeTree(-9,8); makeTree(9,8);
colliders.push({x:-9,z:-7,y:0,w:1.2,d:1.2,h:2});
colliders.push({x:9,z:-7,y:0,w:1.2,d:1.2,h:2});
colliders.push({x:-9,z:8,y:0,w:1.2,d:1.2,h:2});
colliders.push({x:9,z:8,y:0,w:1.2,d:1.2,h:2});

// ========== COINS ==========
var coins=[];
var coinGeo=new THREE.CylinderGeometry(0.15,0.15,0.04,12);
var coinMat=new THREE.MeshStandardMaterial({color:0xffcc00,metalness:0.7,roughness:0.2,emissive:0xffaa00,emissiveIntensity:0.15});
var coinGlowMat=new THREE.MeshBasicMaterial({color:0xffcc00,transparent:true,opacity:0.15,side:THREE.DoubleSide});

function spawnCoin(){
  // Pick random platform
  var p=plats[Math.floor(Math.random()*plats.length)];
  var hw=(p.w-0.4)/2, hd=(p.d-0.4)/2;
  var x=p.x+(Math.random()-0.5)*hw*2;
  var z=p.z+(Math.random()-0.5)*hd*2;
  var y=p.y+0.25;
  var group=new THREE.Group();
  var mesh=new THREE.Mesh(coinGeo,coinMat);
  mesh.rotation.x=Math.PI/2; mesh.castShadow=true;
  group.add(mesh);
  // Glow ring
  var glow=new THREE.Mesh(new THREE.RingGeometry(0.12,0.2,12),coinGlowMat);
  glow.rotation.x=-Math.PI/2; glow.position.y=-0.02;
  group.add(glow);
  group.position.set(x,y,z);
  scene.add(group);
  coins.push({group:group,mesh:mesh,x:x,y:y,z:z,alive:true, bobPhase:Math.random()*Math.PI*2});
}

// ========== PLAYER ==========
camera.position.set(0,1.0,8);
var playerBody=new THREE.Group();
var bodyMesh=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,0.8,8),M(0x44aaff,{roughness:0.3,metalness:0.4}));
bodyMesh.position.y=0.5; playerBody.add(bodyMesh);
var headMesh=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,8),M(0xffcc88,{roughness:0.5,metalness:0}));
headMesh.position.y=0.95; playerBody.add(headMesh);
playerBody.position.set(0,0.5,8); scene.add(playerBody);

var state={
  score:0,
  timeLeft:60,
  running:false,
  ended:false,
  yaw:0,pitch:0,
  input:{w:false,s:false,a:false,d:false,space:false},
  euler:new THREE.Euler(0,0,0,'YXZ'),
  moveVec:new THREE.Vector3(),
  velocityY:0, gravity:-18, jumpSpeed:9, onGround:false, playerHeight:1.0,
};

// Initial coins
for(var i=0;i<20;i++)spawnCoin();

// ========== EVENTS ==========
document.addEventListener('mousedown',function(e){if(e.button===0&&state.running&&!state.ended)renderer.domElement.requestPointerLock();});
document.addEventListener('mousemove',function(e){
  if(document.pointerLockElement!==renderer.domElement)return;
  state.yaw-=e.movementX*0.002; state.pitch-=e.movementY*0.002;
  state.pitch=Math.max(-Math.PI/2.5,Math.min(Math.PI/2.5,state.pitch));
});
document.addEventListener('keydown',function(e){
  switch(e.code){
    case'KeyW':state.input.w=true;break;case'KeyS':state.input.s=true;break;
    case'KeyA':state.input.a=true;break;case'KeyD':state.input.d=true;break;
    case'Space':state.input.space=true;break;
    case'Escape':if(document.pointerLockElement)document.exitPointerLock();break;
  }
});
document.addEventListener('keyup',function(e){
  switch(e.code){
    case'KeyW':state.input.w=false;break;case'KeyS':state.input.s=false;break;
    case'KeyA':state.input.a=false;break;case'KeyD':state.input.d=false;break;
    case'Space':state.input.space=false;break;
  }
});
document.addEventListener('contextmenu',function(e){e.preventDefault();});

// Start
document.getElementById('start-screen').addEventListener('click',function(){
  this.style.display='none';
  renderer.domElement.requestPointerLock();
  state.running=true;
});

// ========== GAME LOOP ==========
var lastTime=performance.now();
var timerEl=document.getElementById('timer');
var scoreEl=document.getElementById('score-val');
var coinTotalEl=document.getElementById('coin-total');
var resultEl=document.getElementById('result');

function endGame(){
  state.ended=true; state.running=false;
  if(document.pointerLockElement)document.exitPointerLock();
  document.getElementById('final-score').textContent=state.score;
  document.getElementById('final-coins').textContent=state.score;
  resultEl.style.display='flex';
}

function animate(t){
  requestAnimationFrame(animate);
  var dt=Math.min((t-lastTime)/1000,0.05);
  lastTime=t;

  if(state.running&&!state.ended){
    // Timer
    state.timeLeft-=dt;
    timerEl.textContent=Math.ceil(state.timeLeft);
    if(state.timeLeft<=10)timerEl.className='warning';
    if(state.timeLeft<=0){endGame();return;}

    // Jump
    if(state.input.space&&state.onGround){state.velocityY=state.jumpSpeed;state.onGround=false;}
    state.velocityY+=state.gravity*dt; camera.position.y+=state.velocityY*dt;
    // Ground/platform collision
    var feetY=camera.position.y-state.playerHeight;
    var groundY=-999;
    // Check platforms
    for(var i=0;i<plats.length;i++){
      var p=plats[i];
      var hw=p.w/2, hd=p.d/2;
      if(Math.abs(camera.position.x-p.x)<hw&&Math.abs(camera.position.z-p.z)<hd){
        var sy=p.y+0.125+state.playerHeight;
        if(feetY<=sy&&camera.position.y>=sy-0.3&&state.velocityY<=0){groundY=sy;break;}
      }
    }
    // Check ground
    if(feetY<=0&&camera.position.y>=0-0.3&&state.velocityY<=0){groundY=state.playerHeight;}
    if(groundY>-999){camera.position.y=groundY;state.velocityY=0;state.onGround=true;}
    // Fall reset
    if(camera.position.y<-5){camera.position.y=2;state.velocityY=0;}
    // Movement
    var sp=4*dt;
    var fw=new THREE.Vector3(-Math.sin(state.yaw),0,-Math.cos(state.yaw));
    var rt=new THREE.Vector3(Math.cos(state.yaw),0,-Math.sin(state.yaw));
    state.moveVec.set(0,0,0);
    if(state.input.w)state.moveVec.add(fw); if(state.input.s)state.moveVec.sub(fw);
    if(state.input.a)state.moveVec.sub(rt); if(state.input.d)state.moveVec.add(rt);
    if(state.moveVec.length()>0){
      state.moveVec.normalize().multiplyScalar(sp);
      camera.position.x+=state.moveVec.x; camera.position.z+=state.moveVec.z;
      camera.position.x=Math.max(-12,Math.min(12,camera.position.x));
      camera.position.z=Math.max(-12,Math.min(12,camera.position.z));
    }
    // Collider push
    var radius=0.3;
    for(var i=0;i<colliders.length;i++){
      var c=colliders[i];
      var hw=c.w/2+radius, hd=c.d/2+radius;
      var dx=camera.position.x-c.x, dz=camera.position.z-c.z;
      if(Math.abs(dx)<hw&&Math.abs(dz)<hd){
        var ox=hw-Math.abs(dx), oz=hd-Math.abs(dz);
        if(ox<oz)camera.position.x+=dx>0?ox:-ox;
        else camera.position.z+=dz>0?oz:-oz;
      }
    }
    playerBody.position.x=camera.position.x;
    playerBody.position.z=camera.position.z;
    playerBody.position.y=camera.position.y-state.playerHeight;
    state.euler.set(state.pitch,state.yaw,0);
    camera.quaternion.setFromEuler(state.euler);

    // Coin collection (proximity)
    for(var i=0;i<coins.length;i++){
      var c=coins[i];
      if(!c.alive)continue;
      var dx=camera.position.x-c.x;
      var dz=camera.position.z-c.z;
      var dy=camera.position.y-c.y;
      if(dx*dx+dz*dz+dy*dy<0.8*0.8){
        c.alive=false; scene.remove(c.group);
        state.score++;
        scoreEl.textContent=state.score;
        // Respawn after short delay
        setTimeout(spawnCoin,2000+Math.random()*3000);
      }
    }
    // Keep minimum coins
    var aliveCount=0;
    for(var i=0;i<coins.length;i++)if(coins[i].alive)aliveCount++;
    if(aliveCount<15)spawnCoin();
    coinTotalEl.textContent=aliveCount;
  }

  // Animate coins (bob + spin)
  for(var i=0;i<coins.length;i++){
    var c=coins[i];
    if(!c.alive)continue;
    c.bobPhase+=dt*2;
    c.group.position.y=c.y+Math.sin(c.bobPhase)*0.08;
    c.group.rotation.y+=dt*1.5;
  }

  renderer.render(scene,camera);
}
animate(performance.now());
</script>
</body>
</html>
